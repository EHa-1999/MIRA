<title>MIRA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Serif:wght@400;600&display=swap">
<style>
/* Layout: één venster met het document links en het paneel van de assistent rechts; schakelaars erboven, de motorkapbalk eronder. Vormtaal gelijk aan de demo "Archiefwaardige opslag voor de medewerker". */
:root{
  --bg:#eaeff0; --surface:#ffffff; --surface2:#f3f7f7; --line:#d3dcde; --fg:#15262b; --muted:#536970;
  --accent:#0d6470; --accent-fg:#ffffff; --accent-soft:#dcedef; --sel:#e2f0f2;
  --amber:#8f5400; --amber-soft:#fbefd6; --red:#a8261d; --red-soft:#fbe3e0;
  --violet:#5b3fa6; --violet-soft:#ebe5f8; --blue:#2c5c9c; --blue-soft:#e1eaf7; --rose:#9c3a69; --rose-soft:#f7e3ec; --green:#1b6f3f; --green-soft:#def2e5;
  --shadow:0 10px 30px rgba(10,40,46,.18); --desk:#ece8e1; --paper:#ffffff; --pane:#f0f6f6;
  --map-land:#e3ecd9; --map-plot:#f3dc8f; --map-road:#ffffff; --map-water:#c9e1ea;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --serif:'IBM Plex Serif',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1618; --surface:#162023; --surface2:#1c292d; --line:#2c3c41; --fg:#e4eced; --muted:#93a7ad;
  --accent:#58b9c7; --accent-fg:#06272c; --accent-soft:#17383e; --sel:#1b3a40;
  --amber:#f0b656; --amber-soft:#3a2c10; --red:#f28b82; --red-soft:#3d1c19;
  --violet:#b7a2f0; --violet-soft:#2a2244; --blue:#8fb6ec; --blue-soft:#1a2b45; --rose:#ef9dc2; --rose-soft:#3a1c2a; --green:#6fcf97; --green-soft:#163322;
  --shadow:0 10px 30px rgba(0,0,0,.5); --desk:#101415; --paper:#1b2427; --pane:#152225;
  --map-land:#22302a; --map-plot:#6b5a1f; --map-road:#3a474b; --map-water:#1d3a44; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e1618; --surface:#162023; --surface2:#1c292d; --line:#2c3c41; --fg:#e4eced; --muted:#93a7ad;
  --accent:#58b9c7; --accent-fg:#06272c; --accent-soft:#17383e; --sel:#1b3a40;
  --amber:#f0b656; --amber-soft:#3a2c10; --red:#f28b82; --red-soft:#3d1c19;
  --violet:#b7a2f0; --violet-soft:#2a2244; --blue:#8fb6ec; --blue-soft:#1a2b45; --rose:#ef9dc2; --rose-soft:#3a1c2a; --green:#6fcf97; --green-soft:#163322;
  --shadow:0 10px 30px rgba(0,0,0,.5); --desk:#101415; --paper:#1b2427; --pane:#152225;
  --map-land:#22302a; --map-plot:#6b5a1f; --map-road:#3a474b; --map-water:#1d3a44; color-scheme:dark }

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}

.shell{height:100%;display:flex;flex-direction:column;gap:10px;padding-block:12px;padding-inline:16px;max-width:1500px;margin-inline:auto}
.ttl h1 small{font-size:12px;font-weight:500;color:var(--muted);margin-left:10px;letter-spacing:0;white-space:nowrap}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 18px}
.ttl{flex:1 1 220px;min-width:0}
.ttl h1{font-size:17px;font-weight:600;text-wrap:balance}
.ttl .sub{color:var(--muted);font-size:12.5px}
.ctl{display:flex;flex-direction:column;gap:3px;min-width:0}
.ctl>span{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.seg{display:flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.seg button{padding:5px 10px;border-radius:6px;font-weight:500;color:var(--muted);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}

.win{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px}
.democtl{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.democtl .era:last-child{border-bottom:0}
.era .ctlb{margin-left:auto}
.era.mini{padding-block:4px;gap:6px 12px}.era.mini .sum{display:flex;flex-wrap:wrap;gap:2px 6px;flex:1;min-width:0;color:var(--fg)}.era.mini .sum i{font-style:normal;color:var(--muted)}
.era.mini .btn svg{margin-right:5px;vertical-align:-1px}
.shell.compact{gap:8px;padding-block:8px}.shell.compact .top .sub{display:none}.shell.compact .win{gap:8px}
.appwin{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 2px 10px rgba(10,40,46,.10)}
.wd-top{display:flex;align-items:center;gap:8px 10px;padding:7px 12px;background:var(--surface2);border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.wd-top .fn{color:var(--fg);font-weight:500;min-width:0;overflow-wrap:anywhere}
.wd-top .env{margin-left:auto}
.wd-bar{display:flex;align-items:center;gap:4px 14px;padding:6px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;font-size:13px;color:var(--muted)}
.wd-bar .menu{display:flex;gap:14px;flex-wrap:wrap}
.wd-bar .menu .on{color:var(--fg);font-weight:500;border-bottom:2px solid var(--accent)}
.wd-bar .url{font-family:var(--mono);font-size:11.5px;background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:2px 10px;overflow-wrap:anywhere}
.wd-bar .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:6px;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.btn:hover:not(:disabled){background:var(--sel)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);background:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:4px 9px;font-size:12.5px}
.link{color:var(--accent);font-weight:500;text-decoration:underline;text-underline-offset:2px;font-size:12.5px}

/* omlijsting van het kantoorpakket: werkbalken, linialen, statusbalk */
.ch{border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);background:var(--surface);user-select:none}
.ch .acts{margin-left:auto;display:flex;gap:6px;align-items:center;flex:none;user-select:auto}
.tl{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:4px;color:var(--muted);flex:none}
.tl.xl{width:34px;height:30px}.tl.xl svg{width:23px;height:23px}
.tl.on{background:var(--accent-soft);color:var(--accent)}
.tl .tx{font-size:13px;font-weight:700;font-family:var(--serif);line-height:1}
.tl .t-i{font-style:italic;font-weight:500}.tl .t-u{text-decoration:underline;font-weight:500}
.tl .t-col{border-bottom:3px solid var(--red);padding:0 2px;font-family:var(--sans);font-weight:600}
.tl .t-abc{font-size:10px;font-family:var(--sans);border-bottom:2px wavy var(--red);font-weight:500}
.tl .t-dec,.tl .t-eur,.tl .t-pct,.tl .t-sum{font-family:var(--sans);font-weight:500;font-size:12.5px}
.tsep{width:1px;height:18px;background:var(--line);margin-inline:4px;flex:none}
.tdd{display:inline-flex;align-items:center;justify-content:space-between;gap:6px;height:22px;border:1px solid var(--line);border-radius:3px;padding:0 6px;font-size:11.5px;background:var(--surface);color:var(--fg);white-space:nowrap;flex:none}
.tdd i{border:4px solid transparent;border-top-color:var(--muted);border-bottom:0}
.rtabs{display:flex;gap:2px;padding:5px 10px 0;background:var(--surface2);overflow:hidden;white-space:nowrap}
.rtabs span{padding:4px 11px 5px;border-radius:5px 5px 0 0}
.rtabs span.on{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:inset 0 -2px 0 var(--app)}
.rtabs .file{color:var(--muted)}
.ch-ms .rbn{min-height:98px}
.sml.chk>span{height:20px;font-size:11px}
.rtabs .appi{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:4px;background:var(--app);color:#fff;font-size:11px;font-weight:700;padding:0;margin:3px 6px 0 0;flex:none}
.ch-ms{--app:#2b579a}.ch-ms.t-rekenblad{--app:#1e7145}.ch-ms.t-presentatie{--app:#c43e1c}.ch-ms.t-mail{--app:#0f6cbd}
.rtabs button{padding:4px 11px 5px;border-radius:5px 5px 0 0;color:var(--muted);font-size:12px}
.rtabs button:hover{color:var(--fg)}
.rtabs button.on{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:inset 0 -2px 0 var(--app)}
.ob{display:inline-flex;align-items:center;gap:4px;border-radius:4px;color:var(--fg);font-size:11.5px;white-space:nowrap;position:relative;flex:none}
.ob:hover{background:var(--sel)}
.ob[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}.ob[aria-pressed="true"] .tl{color:var(--accent)}
.ob.big{flex-direction:column;gap:1px;font-size:10.5px;padding:1px 6px 2px;min-width:56px}
.ob.sm{padding:1px 8px 1px 3px}
.ob.ic{padding:2px}
.ob .cnt{position:absolute;top:-1px;right:2px;background:var(--amber-soft);color:var(--amber);border-radius:99px;padding:0 5px;font-size:10px;font-weight:600;line-height:1.5}
.ob.sm .cnt{position:static}
.ob.ic .cnt{right:-3px;top:-3px;padding:0 4px;font-size:9px}
.ch-lo .mn .on{color:var(--accent);font-weight:600}
.tbr.oab .grip{width:3px;height:18px;border-left:1px dotted var(--muted);border-right:1px dotted var(--muted);flex:none}
.tbr.oab .tbi{gap:2px}
.oaw{display:flex;align-items:center;gap:2px;padding-left:8px;margin-left:4px;border-left:1px solid var(--line);flex:none}
.era.scn{background:repeating-linear-gradient(135deg,var(--surface2) 0 10px,color-mix(in srgb,var(--surface2) 60%,var(--surface)) 10px 20px);padding-block:6px}
.dtag{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:var(--fg);color:var(--surface);border-radius:4px;padding:1px 6px}
.era.scn .btn svg{margin-right:5px;vertical-align:-2px}
.era.scn .en{color:var(--fg)}
.era.scn .en{min-width:0}
.p-act .pls{display:flex;gap:6px;flex-wrap:wrap}
.p-act{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-top:2px}
.sml{display:flex;flex-direction:column;gap:0;justify-content:center;font-size:11px;white-space:nowrap}
.sml>span{display:flex;align-items:center;gap:3px;height:20px}
.sml .tl{width:20px;height:20px}.sml .tl svg{width:14px;height:14px}.sml .tl .tx{font-size:10.5px}
.sml.chk i{width:11px;height:11px;border:1px solid var(--muted);border-radius:2px;margin:0 4px 0 2px;flex:none}
.sml.chk i.on{background:var(--app);border-color:var(--app);box-shadow:inset 0 0 0 2px var(--surface)}
.sml.fld{gap:2px}.sml.fld b{font-weight:500;font-size:10.5px}.sml.fld>span{justify-content:space-between;gap:8px;height:22px}
.tl .t-fn,.tl .t-en,.tl .t-quote,.tl .t-count,.tl .t-hash,.tl .t-pct100,.tl .t-lang,.tl .t-hyph,.tl .t-lnum{font-family:var(--sans);font-weight:500;font-size:11px}
.tl.xl .tx{font-size:15px}
.rbn{display:flex;align-items:stretch;gap:8px;padding:6px 10px 4px}
.rgs{display:flex;min-width:0;overflow:hidden;flex:1}
.rg{display:flex;flex-direction:column;padding:0 10px;border-right:1px solid var(--line);flex:none}
.rg:first-child{padding-left:0}
.ri{display:flex;gap:6px;align-items:center;flex:1}
.rl2{font-size:10px;text-align:center;padding-top:3px;white-space:nowrap}
.big{display:flex;flex-direction:column;align-items:center;font-size:10.5px;gap:1px;white-space:nowrap;border-radius:4px;padding:1px 3px}
.big.on{background:var(--accent-soft);color:var(--accent)}.big.on .tl{color:var(--accent)}
.col2,.stack{display:flex;flex-direction:column;gap:2px}
.trow2{display:flex;gap:2px;align-items:center;min-height:24px}
.gal{display:flex;gap:3px}
.gal span{border:1px solid var(--line);border-radius:3px;padding:9px 9px;font-size:11.5px;font-family:var(--serif);color:var(--fg);white-space:nowrap;background:var(--surface)}
.gal .on{outline:1.5px solid var(--app);outline-offset:-1px}.gal .h1{font-family:var(--sans);font-weight:600;color:var(--app)}.gal .h2{font-family:var(--sans);color:var(--app)}
.ch-lo{background:var(--surface2)}
.ch-lo .mn{display:flex;gap:13px;padding:4px 10px 3px;overflow:hidden;white-space:nowrap;color:var(--fg)}
.tbr{display:flex;align-items:center;gap:8px;padding:2px 8px;border-top:1px solid var(--line);min-height:30px}
.tbi{display:flex;align-items:center;gap:1px;min-width:0;overflow:hidden;flex:1}
.tbi .tdd{margin-right:3px}
.brw{display:flex;align-items:center;gap:10px;padding:5px 10px;background:var(--surface2);border-bottom:1px solid var(--line)}
.brw .dots{display:flex;gap:5px}.brw .dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.brw .url{flex:1;max-width:460px;font-family:var(--mono);font-size:11.5px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:2px 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nbr{display:flex;align-items:center;gap:8px;padding:4px 8px;min-height:34px}
.ntabs{display:flex;gap:11px;margin-inline:8px 4px;white-space:nowrap}
.ntabs .on{color:var(--fg);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}
.rul{position:relative;background:var(--surface2);color:var(--muted);font-size:8.5px;font-family:var(--sans);overflow:hidden;user-select:none;line-height:1}
.rul.f-ms{background:var(--paper)}
.rul i{position:absolute;background:currentColor;opacity:.55}
.rul b{position:absolute;font-weight:400}
.rul .mg{position:absolute;background:color-mix(in srgb,var(--muted) 30%,var(--surface2))}
.rul.h{height:16px;border-bottom:1px solid var(--line)}
.rul.h i{left:var(--p);bottom:0;width:1px;height:3px}.rul.h i.mn2{height:5px;bottom:5px;opacity:.4}
.rul.h b{left:var(--p);top:3px;transform:translateX(-50%)}
.rul.h .mg{top:0;bottom:0}.rul.h .mg.l{left:0}.rul.h .mg.r{right:0}
.rul.h .ind{position:absolute;bottom:0;border:4px solid transparent;border-bottom-color:var(--muted);transform:translateX(-50%)}
.rul.h.f-libre .ind{border-bottom-color:var(--accent)}
.rul.h.f-web{height:13px;font-size:8px}.rul.h.f-web b{top:1px}.rul.h.f-web i.mn2{display:none}
.rul.v{width:16px;border-right:1px solid var(--line)}
.rul.v i{right:0;height:1px;width:3px}.rul.v i.mn2{width:5px;right:5px;opacity:.4}
.rul.v b{left:50%;transform:translate(-50%,-50%) rotate(-90deg)}
.rul.v .mg.t{top:0;left:0;right:0}
.pgwrap{max-width:680px;width:100%;margin-inline:auto;display:grid;grid-template-columns:minmax(0,1fr)}
.pgwrap.hasv{max-width:697px;grid-template-columns:17px minmax(0,1fr)}
.pgwrap>.rul.h{position:sticky;top:-14px;z-index:3;grid-column:-2/-1;grid-row:1}
.pgwrap>.rul.v{grid-column:1;grid-row:2}
.pgwrap>.wd-page{grid-column:-2/-1;grid-row:2}
.slgrid{display:grid;grid-template-columns:17px minmax(0,1fr);grid-template-rows:17px auto}
.slgrid>.corner{background:var(--surface2);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.wd-stat{display:flex;gap:18px;align-items:center;padding:3px 12px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);background:var(--surface2);white-space:nowrap;overflow:hidden;flex:none}
.wd-stat .zm{margin-left:auto;display:flex;gap:8px;align-items:center}
.wd-stat .zm i{width:72px;height:2px;background:var(--line);position:relative}
.wd-stat .zm i::after{content:"";position:absolute;left:50%;top:-4px;width:3px;height:10px;background:var(--muted);border-radius:1px}
.lostrip{width:30px;flex:none;border-left:1px solid var(--line);background:var(--surface2);display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:6px}
@media (max-width:900px){
  .rul,.lostrip,.slgrid>.corner,.wd-stat .zm{display:none}
  .pgwrap,.pgwrap.hasv,.slgrid{display:block;max-width:680px}
  .rbn,.tbr,.nbr{flex-wrap:wrap}
  .rgs,.tbi{flex:1 1 100%}
  .ch .acts{margin-left:0}
  .ch-lo .tbr:nth-child(3){display:none}
  .rgs,.tbi{flex-wrap:wrap}
  .oaw{border-left:0;padding-left:0;margin-left:0;flex-wrap:wrap}
  .rtabs{overflow-x:auto}.rtabs>*{flex:none}
  .rg{flex:0 1 auto;border-right:0}.ri{flex-wrap:wrap}.rgs{gap:4px 0}
  .era.scn .en{flex:1 1 100%}
}
.wd-body{flex:1;min-height:0;display:flex}
.wd-desk{flex:1;min-width:0;overflow:auto;background:var(--desk);padding:14px 16px 28px;display:flex;flex-direction:column;gap:12px}
.regie{max-width:680px;width:100%;margin-inline:auto;border:1px dashed var(--muted);border-radius:8px;padding:8px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:12.5px;color:var(--muted);background:color-mix(in srgb,var(--surface) 55%,transparent)}
.regie b{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.regie .sp{flex:1}
.callout{max-width:680px;width:100%;margin-inline:auto;border-radius:8px;padding:9px 12px;font-size:13px;background:var(--red-soft);color:var(--red);display:flex;gap:8px;align-items:flex-start}
.wd-page{background:var(--paper);max-width:680px;width:100%;margin-inline:auto;padding:28px 46px 52px;box-shadow:0 1px 4px rgba(0,0,0,.18);font-family:var(--serif);font-size:14px;line-height:1.62;transition:opacity .2s}
.wd-page.reloading{opacity:.25}
.wd-mark{display:flex;justify-content:space-between;gap:10px;font-family:var(--sans);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:20px;font-weight:600;flex-wrap:wrap}
.wd-page h2{font-size:22px;line-height:1.25;font-weight:600;text-wrap:balance;margin-bottom:10px}
.wd-page h3{font-family:var(--sans);font-size:14px;font-weight:600;margin:20px 0 6px}
.wd-page p{margin-bottom:8px;max-width:64ch}
.comp{position:relative;margin:8px -10px;padding:8px 10px;border:1.5px dashed transparent;border-radius:6px;font-family:var(--sans)}
.assist .comp{cursor:pointer}
.assist .comp:hover{border-color:var(--line)}
.assist .comp.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.assist .comp.emb{border:1.5px solid color-mix(in srgb,var(--accent) 50%,var(--line));margin-top:18px;padding-top:12px}
.assist .comp.emb.cf{border-color:color-mix(in srgb,var(--violet) 60%,var(--line))}
.assist .comp.emb.st{border-color:var(--amber)}
.assist .comp.emb:hover{border-color:var(--accent)}
.comp .lg{position:absolute;top:-9px;left:10px;max-width:calc(100% - 20px);background:var(--lgbg,var(--paper));padding:0 6px;font-size:10.5px;line-height:16px;font-family:var(--sans);color:var(--accent);display:flex;gap:5px;align-items:center;white-space:nowrap;overflow:hidden}
.comp .lg svg{width:12px;height:12px;flex:none}
.comp .lg b{font-weight:600;flex:none}
.comp .lg i{font-style:normal;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.comp.cf .lg{color:var(--violet)}.comp.st .lg{color:var(--amber)}
.notes{--lgbg:var(--surface)}
.ebox{border:1px dashed var(--muted);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--muted);background:var(--surface)}
.ebox b{display:block;color:var(--fg);font-size:13px;margin-bottom:3px}
.elist{margin:0;padding-left:18px;font-size:12.5px;display:flex;flex-direction:column;gap:4px}
.dlg.obj{max-width:760px;gap:14px}

.otwo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.otwo>div{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}

.irows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px}
.irow{font-size:12.5px;color:var(--muted);line-height:1.45}

.comp .tag{position:absolute;top:-10px;right:8px;display:none;gap:4px}
.assist .comp.sel .tag,.assist .comp:hover .tag{display:flex}
.ktab{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.ktab th,.ktab td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}
.ktab th{font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.ktab td:last-child,.ktab th:last-child{text-align:right}
.src{font-size:11.5px;color:var(--muted);margin-top:5px;display:flex;gap:5px;align-items:flex-start}
.src.none{font-style:italic}
.stale{margin-top:6px;font-size:12px;background:var(--amber-soft);color:var(--amber);border-radius:5px;padding:5px 8px;display:flex;gap:6px;align-items:flex-start}
.gap{border:1px solid var(--line);background:repeating-linear-gradient(135deg,var(--surface2) 0 8px,transparent 8px 16px);border-radius:6px;padding:14px 12px;font-size:12.5px;color:var(--fg)}
.gap small{display:block;color:var(--muted);font-size:11.5px;margin-top:3px}
.slot{border:1.5px dashed var(--line);border-radius:6px;padding:22px 12px;text-align:center;color:var(--muted);font-size:12.5px}
.chart,.map{display:block;width:100%;height:auto}
.chart text,.map text{font-family:var(--sans);fill:var(--muted)}

.wd-pane{width:400px;flex:none;border-left:1px solid var(--line);background:var(--pane);overflow:auto;min-height:0;display:flex;flex-direction:column}
.p-head{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.p-head .row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.p-head h2{font-size:14px;font-weight:600}
.ladder{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.steps{display:flex;gap:3px}
.steps i{width:18px;height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--accent)}
.steps i.cap{background:repeating-linear-gradient(90deg,var(--line) 0 3px,transparent 3px 6px)}
.sec{padding:10px 14px 12px;border-bottom:1px solid var(--line)}
.sec>h3{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.oitem{border:1px solid var(--line);background:var(--surface);border-radius:8px;margin-bottom:6px;overflow:hidden}

.ohead{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;width:100%;padding:7px 9px}

.ohead .nm{flex:1 1 130px;min-width:0;font-weight:500;font-size:13px}
.ohead .nm small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.ohead .pills{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:3px 6px;margin-left:auto;max-width:100%}
.ohead .pill{white-space:normal;text-align:left}
.obody{padding:2px 10px 10px;border-top:1px solid var(--line);font-size:12.5px}
.kv{display:grid;grid-template-columns:104px minmax(0,1fr);gap:3px 8px;margin:8px 0}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.note{font-size:12px;color:var(--muted);margin:6px 0}
.note.warn{color:var(--amber)} .note.bad{color:var(--red)}
.rowb{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ic{flex:none;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.ic.v{background:var(--violet-soft);color:var(--violet)}
.ic.off{background:var(--surface2);color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:500;line-height:18px;white-space:nowrap}
.p-green{background:var(--green-soft);color:var(--green)} .p-amber{background:var(--amber-soft);color:var(--amber)}
.p-red{background:var(--red-soft);color:var(--red)} .p-violet{background:var(--violet-soft);color:var(--violet)}
.p-teal{background:var(--accent-soft);color:var(--accent)}
.p-grey{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}

.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:10px 14px 0}
.tabs button{padding:4px 9px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--muted);border:1px solid transparent}
.tabs button:hover{background:var(--surface)}
.tabs button[aria-selected="true"]{background:var(--surface);border-color:var(--line);color:var(--fg)}
.tabs button small{font-weight:400;font-size:10.5px;margin-left:3px}
.form{padding:10px 14px 16px;display:flex;flex-direction:column;gap:10px}
.fld{display:flex;flex-direction:column;gap:3px}
.fld .lab{display:flex;align-items:baseline;gap:6px;font-size:12px;font-weight:500}
.fld .lab .kind{font-weight:400;color:var(--muted);font-size:11px}
.fld .lab .wzd{margin-left:auto}
.inp{width:100%;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-size:13px;min-height:32px}
.inp.derived{border-style:dashed;background:transparent;color:var(--muted)}
.inp.asked{border-color:var(--accent)}
.hint{font-size:11.5px;color:var(--muted)}
.hint.warn{color:var(--amber)}
.chips{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid var(--line);background:var(--surface)}
.chip.d{border-style:dashed;background:transparent;color:var(--muted)}
.chip.v{border-color:transparent;background:var(--violet-soft);color:var(--violet)}
.chip button{color:var(--muted);font-size:13px;line-height:1}
.claim{border-left:3px solid var(--accent);background:var(--surface);border-radius:0 6px 6px 0;padding:6px 10px;font-size:12px;margin-top:2px}
.claim.old{border-left-color:var(--line);color:var(--muted)}
.claim .kv{margin:0;grid-template-columns:78px minmax(0,1fr)}
.claim h4{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:4px}
.empty{padding:16px 14px;font-size:13px;color:var(--muted)}
.empty b{color:var(--fg);font-weight:600;display:block;margin-bottom:4px}
.m-ovz,.r-ovz{--mc:var(--fg);--ms:var(--surface2)}.m-ond,.r-ond{--mc:var(--accent);--ms:var(--accent-soft)}.m-meta,.r-meta{--mc:var(--blue);--ms:var(--blue-soft)}
.m-toeg,.r-toeg{--mc:var(--violet);--ms:var(--violet-soft)}.m-anon,.r-anon{--mc:var(--fg);--ms:color-mix(in srgb,var(--fg) 9%,var(--surface))}
.m-clas,.r-clas{--mc:var(--amber);--ms:var(--amber-soft)}.m-waar,.r-waar{--mc:var(--green);--ms:var(--green-soft)}
.m-flow,.r-flow{--mc:var(--rose);--ms:var(--rose-soft)}.m-help,.r-help{--mc:var(--muted);--ms:var(--surface2)}
.qsave{display:inline-grid;border-radius:4px}.qsave:hover{background:var(--sel)}.qsave .tl{width:22px;height:22px}
.rtabs button.file{color:var(--muted)}
.p-loc{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}.p-loc .tl{width:18px;height:18px}.p-loc .tl svg{width:13px;height:13px}
.dlg.sv{max-width:780px;padding:0;gap:0;overflow:hidden;font-size:12.5px}
.svh{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 8px 14px;background:var(--surface2);border-bottom:1px solid var(--line)}
.svh h2{font-size:13px;font-weight:600}.svh .x{font-size:18px;line-height:1;width:26px;height:26px;border-radius:4px;color:var(--muted)}.svh .x:hover{background:var(--red-soft);color:var(--red)}
.svc{display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:6px 12px;border-bottom:1px solid var(--line)}
.svc button{padding:2px 6px;border-radius:4px}.svc button:hover{background:var(--sel)}.svc i{font-style:normal;color:var(--muted)}
.svb{display:grid;grid-template-columns:250px minmax(0,1fr);height:230px;border-bottom:1px solid var(--line)}
.svtree{overflow:auto;border-right:1px solid var(--line);padding:6px 0;background:var(--surface2)}
.svt{display:flex;align-items:center;gap:4px;width:100%;text-align:left;padding:2px 8px;white-space:nowrap}
.svt:hover{background:var(--sel)}.svt.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.svt .tl,.svlist .tl{width:20px;height:20px}.svt .tl svg,.svlist .tl svg{width:14px;height:14px}
.svlist{overflow:auto}.svlist table{width:100%;border-collapse:collapse}
.svlist th{position:sticky;top:0;background:var(--surface);text-align:left;font-weight:500;color:var(--muted);font-size:11.5px;padding:5px 10px;border-bottom:1px solid var(--line)}
.svlist td{padding:2px 10px;white-space:nowrap;color:var(--muted)}.svlist td:first-child{color:var(--fg);display:flex;align-items:center;gap:4px}
.svlist td .pill{margin-left:6px}.svlist td.mt{color:var(--muted);padding:14px 10px}
.svr{cursor:pointer}.svr:hover td{background:var(--sel)}
.svdet{display:flex;flex-wrap:wrap;gap:4px 14px;padding:6px 14px;background:var(--accent-soft);color:var(--fg);font-size:12px;border-bottom:1px solid var(--line)}
.sverr{display:flex;gap:8px;align-items:flex-start;padding:8px 14px;background:var(--red-soft);color:var(--red);font-size:12.5px}.sverr span{color:var(--fg)}.sverr span b{color:var(--red);font-weight:600}
.svf2{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 10px;align-items:center;padding:10px 14px 4px}.svf2 .tdd{justify-self:start}
.dlg.sv .rowb{padding:8px 14px 12px}
.svnote{display:flex;gap:10px;align-items:flex-start;padding:9px 14px;border-top:1px dashed var(--muted);font-size:12px;color:var(--fg);background:repeating-linear-gradient(135deg,var(--surface2) 0 10px,color-mix(in srgb,var(--surface2) 60%,var(--surface)) 10px 20px)}
.svnote .dtag{flex:none;margin-top:1px}
.dlg.sv.web .svh{background:var(--surface)}.dlg.sv.web .svb{grid-template-columns:200px minmax(0,1fr)}.dlg.sv.web{max-width:860px}.dlg.sv.web{border-radius:14px}
@media (max-width:640px){.svb{grid-template-columns:minmax(0,1fr);height:auto}.svtree{border-right:0;border-bottom:1px solid var(--line);max-height:150px}.svlist{max-height:200px}.svf2{grid-template-columns:minmax(0,1fr)}}
.wd-pane.rl{overflow:hidden}
.wd-body.nopane .wd-pane{display:none}
.rgo{display:flex;flex:none}.rgo .rg{border-right:0;border-left:1px solid var(--line)}
.wd-pane.rl .p-head{background:var(--surface)}
.p-mld{background:var(--surface2);border-bottom:1px solid var(--line);font-size:12.5px}
.p-mld .mh{display:flex;align-items:center;gap:7px;width:100%;padding:7px 14px;text-align:left;color:var(--muted)}
.p-mld .mh b{font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.p-mld .mh svg{transition:transform .15s;flex:none}.p-mld .mh[aria-expanded="true"] svg{transform:rotate(90deg)}
.p-mld .mh:disabled svg{visibility:hidden}
.p-mld .mc{background:var(--amber-soft);color:var(--amber);border-radius:99px;padding:0 7px;font-weight:600;font-size:11.5px}
.p-mld .mn0{font-size:12px}
.p-mld .ml{display:flex;flex-direction:column;padding:0 8px 7px}
.mrow{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;text-align:left;color:var(--fg);width:100%}
.mrow:hover{background:var(--surface)}
.mrow>span:nth-child(2){flex:1;min-width:0}
.mrow .to{color:var(--accent);font-size:11.5px;font-weight:500;white-space:nowrap}
.mrow .to::after{content:" ›"}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--muted)}
.dot.d-amber{background:var(--amber)}.dot.d-teal{background:var(--accent)}
.p-main{flex:1;min-height:0;display:flex}
.p-view{flex:1;min-width:0;overflow:auto;display:flex;flex-direction:column;background:color-mix(in srgb,var(--ms) 22%,var(--pane))}
.p-vh{position:sticky;top:0;z-index:2;display:flex;gap:9px;align-items:center;padding:6px 12px;background:var(--ms);border-bottom:1px solid var(--line);border-left:3px solid var(--mc)}
.p-vh h3{font-size:13.5px;font-weight:600;line-height:1.3}
.p-vh p{font-size:11.5px;color:var(--muted);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-vh>div{flex:1;min-width:0}
.p-vh .conn{display:block;flex:0 0 9px;width:9px;height:9px;border-radius:50%;background:var(--green);flex:none;margin-right:2px}
.ovn{font-size:13px;font-weight:600;overflow-wrap:anywhere;margin-bottom:4px}
.sec .p-act{margin-top:8px}
.sec .ml{display:flex;flex-direction:column;margin-inline:-6px}
.vic{display:grid;place-items:center;width:28px;height:28px;border-radius:7px;background:var(--surface);flex:none}
.vic .tl{color:var(--mc)}
.p-rail{width:44px;flex:none;overflow:hidden;border-left:1px solid var(--line);background:var(--surface2);display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:6px 0}
.p-rail button{position:relative;display:grid;place-items:center;height:36px}
.p-rail button .tl{width:30px;height:30px;border-radius:7px;color:var(--mc)}
.p-rail button .tl svg{width:18px;height:18px}
.p-rail button:hover .tl{background:var(--surface)}
.p-rail button[aria-selected="true"]{box-shadow:inset 3px 0 0 var(--mc)}
.p-rail button[aria-selected="true"] .tl{background:var(--ms)}
.p-rail button.last{margin-top:auto}
.p-rail .cnt{position:absolute;top:1px;right:3px;background:var(--amber-soft);color:var(--amber);border-radius:99px;padding:0 4px;font-size:9.5px;font-weight:600;line-height:1.5}
.p-rail .cnt.okc{background:var(--green-soft);color:var(--green)}
.hl{display:flex;flex-direction:column;gap:2px}
.hrow{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:6px;border-radius:7px;width:100%}
.hrow:hover{background:var(--surface)}
.hrow>span:last-child{display:flex;flex-direction:column;font-size:12px;color:var(--muted);line-height:1.4;min-width:0}
.hrow b{font-size:13px;color:var(--fg);font-weight:600}
.wd-pane.rl .p-foot{background:var(--surface2)}
@media (max-width:900px){
  .wd-pane.rl{overflow:visible}
  .p-main{flex-direction:column-reverse}
  .p-view{overflow:visible}.p-vh{position:static}
  .p-rail{width:auto;flex-direction:row;border-left:0;border-bottom:1px solid var(--line);padding:4px 8px;overflow-x:auto}
  .p-rail button{width:40px;flex:none}
  .p-rail button.last{margin-top:0;margin-left:auto}
  .p-rail button[aria-selected="true"]{box-shadow:inset 0 -3px 0 var(--mc)}
}
.p-foot{margin-top:auto;padding:8px 14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}

.hood{background:var(--surface);border:1px solid var(--line);border-radius:8px;font-size:12px;overflow:hidden;flex:none}
.hood-bar{display:flex;align-items:center;gap:10px;padding:6px 12px;width:100%}
.hood-bar b{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;flex:none}
.hood-bar code{flex:1;min-width:0;font-family:var(--mono);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hood-bar span{color:var(--accent);font-weight:500;flex:none}
.hood-log{max-height:150px;overflow:auto;border-top:1px solid var(--line);padding:6px 12px;font-family:var(--mono);font-size:11.5px;display:flex;flex-direction:column;gap:3px}
.hood-log div{overflow-wrap:anywhere}
.hood-log time{color:var(--muted);margin-right:8px}

#layer:empty{display:none}
#layer{position:fixed;inset:0;background:rgba(8,24,28,.45);display:grid;place-items:center;padding:16px;z-index:10}
.dlg{background:var(--surface);border-radius:10px;box-shadow:var(--shadow);max-width:540px;width:100%;max-height:100%;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.dlg h2{font-size:16px;font-weight:600}

.dlg li span:last-child{color:var(--muted);text-align:right}
.q{border:1px solid var(--amber);background:var(--amber-soft);border-radius:8px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:8px}
.q label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.q label small{display:block;color:var(--muted)}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;cursor:pointer}
.dlg .rowb{justify-content:flex-end}
.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;z-index:20;max-width:min(380px,calc(100% - 32px))}
.toast{background:var(--fg);color:var(--bg);padding:8px 12px;border-radius:8px;font-size:13px;box-shadow:var(--shadow)}

@media (max-width:900px){
  html,body{height:auto}
  .shell{height:auto}
  .win{overflow:visible}.appwin{overflow:visible}
  .wd-body{display:block}
  .wd-desk{overflow:visible;padding:12px}

}

/* rekenblad */
.sheet{background:var(--paper);max-width:760px;width:100%;margin-inline:auto;box-shadow:0 1px 4px rgba(0,0,0,.18);font-family:var(--sans);transition:opacity .2s}
.sheet.reloading,.deckwrap.reloading,.mail.reloading{opacity:.25}
.fx{display:flex;gap:8px;align-items:center;padding:5px 10px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.fx code{font-family:var(--mono);font-size:11.5px;color:var(--fg);overflow-wrap:anywhere}
.cellwrap{overflow-x:auto}
.cells{border-collapse:collapse;font-size:12.5px;width:100%;min-width:540px;font-variant-numeric:tabular-nums}
.cells th,.cells td{border:1px solid var(--line);padding:4px 8px;height:27px;white-space:nowrap}

.cells th.rn{width:30px}
.cells td.n{text-align:right}
.cells td.h{font-weight:600}
.cells td.chg{background:var(--amber-soft);color:var(--amber);font-weight:500}
.cells td.err{color:var(--red);font-family:var(--mono);font-size:11.5px}
.cells tbody.rng td{background:color-mix(in srgb,var(--accent-soft) 40%,transparent)}
.cells tbody.rng.lnk td{background:color-mix(in srgb,var(--violet-soft) 45%,transparent)}
.assist .cells tbody.rng{cursor:pointer}
.cells tbody.rng.sel td{background:var(--accent-soft)}
.cells tbody.rng.lnk.sel td{background:var(--violet-soft)}
.cells .rl{margin-left:8px;font-weight:500}
.sheet .foot{padding:6px 10px}
.tabsrow{display:flex;gap:4px;padding:6px 8px;border-top:1px solid var(--line);font-size:12px;flex-wrap:wrap;align-items:center}
.tabsrow span{padding:3px 10px;border:1px solid var(--line);border-radius:0 0 6px 6px;color:var(--muted)}
.tabsrow span.on{background:var(--surface2);color:var(--fg);font-weight:500}
.tabsrow button.hid{padding:3px 10px;border:1px dashed var(--violet);border-radius:0 0 6px 6px;color:var(--violet);font-style:italic;display:inline-flex;gap:5px;align-items:center}
.tabsrow button.hid.sel{background:var(--violet-soft)}
/* presentatie */
.deckwrap{max-width:780px;width:100%;margin-inline:auto;display:flex;gap:10px;transition:opacity .2s}
.rail{display:flex;flex-direction:column;gap:6px;width:96px;flex:none}
.thumb{border:1px solid var(--line);background:var(--paper);border-radius:4px;font-size:10.5px;padding:6px;line-height:1.25;min-height:54px;display:flex;flex-direction:column;gap:2px;color:var(--muted)}
.thumb b{color:var(--fg);font-weight:600}
.thumb[aria-current="true"]{outline:2px solid var(--accent);outline-offset:1px}
.stage{flex:1;min-width:0;display:flex;flex-direction:column;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.slide{background:var(--paper);padding:24px 30px 20px;min-height:330px;display:flex;flex-direction:column;gap:6px;font-family:var(--sans)}
.slide h2{font-size:24px;font-weight:600;line-height:1.2;text-wrap:balance}
.slide .lead{color:var(--muted);font-size:14px}
.slide.title{justify-content:center;border-left:10px solid var(--accent)}
.slide .comp{margin-block:4px}
.notes{background:var(--surface);border-top:1px solid var(--line);padding:10px 16px 12px;font-size:12.5px;font-family:var(--sans)}
.notes h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;margin-bottom:4px}
.notes .comp{margin-block:4px}
/* e-mail */
.mail{background:var(--paper);max-width:680px;width:100%;margin-inline:auto;box-shadow:0 1px 4px rgba(0,0,0,.18);font-family:var(--sans);transition:opacity .2s}
.mhead{display:grid;grid-template-columns:86px minmax(0,1fr);gap:6px 10px;padding:14px 20px;border-bottom:1px solid var(--line);font-size:13px}
.mhead dt{color:var(--muted)} .mhead dd{margin:0;overflow-wrap:anywhere}
.mhead dd.subj{font-weight:600}
.atts{display:flex;flex-wrap:wrap;gap:8px;padding:10px 20px;border-bottom:1px solid var(--line)}
.att{display:flex;gap:8px;align-items:center;border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;min-width:0;max-width:100%}
.att small{display:block;color:var(--muted);font-size:11.5px}
.att .pills{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.assist .att{cursor:pointer}
.assist .att.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.mbody{padding:16px 20px 22px;font-size:14px;line-height:1.6}
.mbody p{margin-bottom:10px;max-width:64ch}
.quote{border-left:3px solid var(--line);padding-left:12px;color:var(--muted);font-size:13px}
.used{display:flex;flex-direction:column;gap:6px}
.used .oitem{margin:0}
.sub2{font-size:12px;color:var(--muted);margin:8px 0 4px;font-weight:600}
.nest{list-style:none;margin:4px 0 0;padding:0 0 0 10px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:4px}
.nest li{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:900px){
  .deckwrap{flex-direction:column}
  .rail{flex-direction:row;width:auto}
  .thumb{flex:1;min-width:0}
  .slide{padding:16px 16px 14px;min-height:0}
  .mhead,.atts,.mbody{padding-inline:14px}
}

/* weergaven */
.views{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--line);flex:1 1 100%;order:2}
.views button{padding:6px 12px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-size:13.5px}
.views button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.views button small{font-weight:400;font-size:10.5px;margin-left:4px}
.ctls{display:flex;flex-wrap:wrap;gap:10px 18px;flex:1 1 100%;order:3}
.ph{flex:1;min-height:0;overflow:auto;padding:22px 24px 30px;display:flex;flex-direction:column;gap:16px}
.ph h2{font-size:19px;font-weight:600;text-wrap:balance;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ph p{max-width:68ch;color:var(--muted)}
.ph h3{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.ph ul,.ph ol{margin:0;padding-left:20px;max-width:72ch;display:flex;flex-direction:column;gap:5px}
.lay{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;max-width:980px}
.lay div{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--surface2)}
.lay b{display:block;font-weight:600;margin-bottom:3px}
.lay span{font-size:12.5px;color:var(--muted)}
.tw{overflow-x:auto;max-width:980px}
.tt{border-collapse:collapse;font-size:13px;width:100%;min-width:560px}
.tt th,.tt td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tt th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
@media (max-width:900px){.ph{overflow:visible;padding:16px}}

/* modules */
.vec{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;display:flex;flex-direction:column;gap:4px}
.vh{display:flex;align-items:baseline;gap:4px 8px;flex-wrap:wrap}
.vh b{font-size:13px;font-weight:600}
.vh span{font-size:11.5px;color:var(--muted)}
.vh .wzd{margin-left:auto}
.vv{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;font-size:13px;font-weight:500}
.vv .pill{flex:none}
.vec .note{margin:2px 0}
.vec .sub2{margin:4px 0 0}
.nest li>span:first-child{min-width:0;flex:1 1 120px}
.gr{display:block;font-size:11px;color:var(--muted);font-weight:400}
.accstate{border-radius:8px;padding:9px 11px;display:flex;flex-direction:column;gap:2px;font-size:12.5px}
.accstate b{font-size:13.5px;font-weight:600}
.accstate.ok{background:var(--green-soft);color:var(--green)}
.accstate.warn{background:var(--amber-soft);color:var(--amber)}
.accstate.off{background:var(--surface2);color:var(--fg);border:1px dashed var(--muted)}
.accstate span{color:var(--fg)}
.finding{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;font-size:12.5px;display:flex;flex-direction:column;gap:5px}
.finding.done{background:transparent}
.finding .fh{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:13px}
.finding .fh b{font-weight:600}
.finding .fh:hover b{text-decoration:underline}
.finding .rowb{margin-top:2px}
.altp{border-left:3px solid var(--accent);padding:4px 9px;background:var(--surface2);border-radius:0 6px 6px 0}
.altp small{display:block;color:var(--muted);font-size:11px}
.fakeh{font-family:var(--sans);font-size:14px;font-weight:600;margin:20px 0 6px}
.hl{background:var(--amber-soft);box-shadow:0 0 0 4px var(--amber-soft);border-radius:2px}
.stage.hl{box-shadow:0 0 0 3px var(--amber)}
.tabs button small.cnt{background:var(--amber-soft);color:var(--amber);border-radius:99px;padding:0 6px;font-weight:600}

/* colofon */
@property --ca{syntax:'<angle>';inherits:false;initial-value:0deg}
.dlg.colo{max-width:640px;padding:0;gap:0;position:relative;overflow:hidden;isolation:isolate;border:1px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,conic-gradient(from var(--ca,0deg),var(--accent),var(--violet),var(--amber),var(--green),var(--accent)) border-box;animation:clBorder 8s linear infinite}
.colo .cfx{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:-1;border-radius:inherit}
.colo .cin{overflow:auto;min-height:0;flex:1}
.colo .aur{position:absolute;inset:-40%;z-index:-1;pointer-events:none;opacity:.32;filter:blur(40px);background:radial-gradient(closest-side at 30% 30%,var(--accent),transparent 70%),radial-gradient(closest-side at 70% 40%,var(--violet),transparent 70%),radial-gradient(closest-side at 50% 75%,var(--amber),transparent 70%);animation:clAur 18s ease-in-out infinite alternate}
.colo .sp{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:0;pointer-events:none;z-index:0;animation:clSp 6s ease-in-out infinite}
.colo .chead{display:flex;gap:16px;align-items:center;padding:18px 18px 4px}
.colo .seal{flex:none;width:96px;height:96px;position:relative}
.colo .seal svg.ring{position:absolute;inset:0;animation:clSpin 28s linear infinite}
.colo .seal text{font:600 8.4px var(--mono,monospace);letter-spacing:.18em;fill:var(--accent)}
.colo .seal svg.core{position:absolute;inset:22px;width:52px;height:52px}
.colo .seal .draw{stroke-dasharray:120;stroke-dashoffset:120;animation:clDraw 1.6s .3s ease-out forwards}
.colo h2.ct{font-size:24px;margin:0;font-weight:700;letter-spacing:-.01em;background:linear-gradient(100deg,var(--fg) 20%,var(--accent) 40%,var(--violet) 50%,var(--fg) 70%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:clShine 6s ease-in-out infinite}
.colo .csub{color:var(--muted);font-size:12.5px;margin-top:2px}
.colo .mb{padding:10px 18px 4px}
.colo dl{display:grid;grid-template-columns:132px minmax(0,1fr);gap:9px 14px;margin:0;font-size:13px}
.colo dt{color:var(--muted)}
.colo dd{margin:0;display:flex;flex-direction:column;gap:1px;overflow-wrap:anywhere}
.colo dd small{color:var(--muted);font-size:12px}
.colo dd ul{list-style:disc;margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.colo dd li{display:list-item;border:0;padding:0}
.colo dd a{color:var(--accent)}
.colo .sel{user-select:all;font-family:var(--mono);font-size:12px}
.colo .cl{opacity:0;transform:translateY(8px);animation:clIn .55s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i)*85ms + 250ms)}
.colo .cnote{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px;color:var(--muted);font-size:12px}
.colo .cfoot{display:flex;justify-content:flex-end;padding:10px 18px 16px}
@media (max-width:560px){.colo .chead{flex-direction:column;align-items:flex-start}.colo dl{grid-template-columns:1fr;gap:2px}.colo dd{margin-bottom:8px}}
@media (prefers-reduced-motion:reduce){.dlg.colo,.colo .aur,.colo .sp,.colo .seal svg.ring,.colo h2.ct{animation:none}.colo .cl{animation:none;opacity:1;transform:none}.colo .seal .draw{animation:none;stroke-dashoffset:0}}
@keyframes clBorder{to{--ca:360deg}}
@keyframes clAur{0%{transform:translate(-6%,-4%) rotate(0deg) scale(1)}100%{transform:translate(6%,5%) rotate(25deg) scale(1.12)}}
@keyframes clSp{0%{opacity:0;transform:translateY(10px) scale(.6)}30%{opacity:.8}100%{opacity:0;transform:translateY(-60px) scale(1.2)}}
@keyframes clSpin{to{transform:rotate(360deg)}}
@keyframes clDraw{to{stroke-dashoffset:0}}
@keyframes clShine{0%{background-position:100% 0}100%{background-position:0 0}}
@keyframes clIn{to{opacity:1;transform:none}}

/* anonimiseren en beoordelen */
.plh{font-family:var(--mono);font-size:.82em;padding:1px 5px;border-radius:4px;cursor:pointer;border:1px solid transparent;white-space:nowrap;font-style:normal;font-weight:500}
.plh.l1{background:var(--green-soft);color:var(--green)}.plh.l2{background:var(--amber-soft);color:var(--amber)}.plh.l3{background:var(--red-soft);color:var(--red)}
.plh.dec{background:transparent;border-color:currentColor;font-family:inherit;font-size:inherit;white-space:normal}
.plh.ro{cursor:default}
.plh.pv{border:1px dashed currentColor}
.plh.on,.phn.on{outline:2px solid var(--accent);outline-offset:1px}
.phn{border-bottom:1px dotted var(--muted);cursor:pointer}
.finding .bas{font-size:11.5px;color:var(--muted);margin-left:auto}
.fprops{flex:none;align-self:center;width:min(100%,820px);background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--violet);border-radius:8px;padding:8px 12px;font-size:12.5px}
.fph{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-bottom:6px}.fph span{color:var(--muted)}
.fprops dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;margin:0}.fprops dt{color:var(--muted)}.fprops dd{margin:0}
.fpt{margin:10px 0 0;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.brpick{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.brpick select{flex:1;min-width:140px}
.cells td.dsh{white-space:nowrap}.cells td.dsh .cb{margin-right:5px}
.assist .cells td.dsh.pg{background:var(--amber-soft);cursor:pointer}.assist .cells td.dsh.sel{background:var(--green-soft);cursor:pointer}
.cells td.psd{font-family:var(--mono);font-size:10.5px;color:var(--green);background:color-mix(in srgb,var(--green-soft) 45%,transparent)}
.sheet.ds .cellwrap{max-height:none}
.tabsrow button.tb{padding:3px 10px;border:1px solid var(--line);border-radius:0 0 6px 6px;color:var(--muted)}
.tabsrow button.tb:hover{background:var(--surface2);color:var(--fg)}
.pscols{display:flex;flex-direction:column;gap:1px}
.psc{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:6px;text-align:left;font-size:12.5px;width:100%}
.psc:not(:disabled):hover{background:var(--surface)}.psc:disabled{cursor:default}
.psc>span:nth-child(2){flex:1}.psc .cb{color:var(--muted)}
.psadd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px;color:var(--fg);font-weight:500}
.pschips{display:flex;flex-wrap:wrap;gap:4px;align-items:center}.pschips i{font-style:normal;color:var(--muted)}
.psex{font-family:var(--mono);font-size:11px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px;overflow-wrap:anywhere}.psex i{font-style:normal;color:var(--muted)}
.pii{border-bottom:2px dotted var(--amber);cursor:pointer;border-radius:2px}
.pii.on{background:var(--amber-soft)}
.redact{background:var(--fg);color:var(--bg);font-family:var(--mono);font-size:.78em;padding:1px 6px;border-radius:2px;white-space:nowrap}
mark.rm{background:var(--amber-soft);color:inherit;border-bottom:2px solid var(--amber);cursor:pointer;padding:0 2px;border-radius:2px}
mark.rm.s-lak{background:var(--red-soft);border-color:var(--red);text-decoration:line-through}
mark.rm.s-laat{background:var(--green-soft);border-color:var(--green)}
mark.rm.on{outline:2px solid var(--accent);outline-offset:1px}
mark.rm sup{font-family:var(--sans);font-size:10px;font-weight:600;margin-right:3px;display:inline-block;text-decoration:none}
.num{flex:none;width:20px;height:20px;border-radius:50%;background:var(--amber-soft);color:var(--amber);display:grid;place-items:center;font-size:11px;font-weight:600}
.zk{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.zb{width:44px;height:5px;border-radius:3px;background:var(--line);overflow:hidden;display:block}
.zb i{display:block;height:100%;background:var(--accent)}
.zrow{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.cit{font-family:var(--serif);font-style:italic;color:var(--muted)}
.finding.selc{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.finding .fh{text-align:left}
.comp.rvc{border-color:var(--violet);background:color-mix(in srgb,var(--violet-soft) 40%,transparent)}
#rv-pages .regie{max-width:680px}
#rv-side .p-head{position:sticky;top:0;background:var(--pane);z-index:1}
.sech{display:flex;align-items:center;gap:6px;font:inherit;text-transform:inherit;letter-spacing:inherit;color:inherit;font-weight:600}
.sech svg{transition:transform .12s}
.sech[aria-expanded="true"] svg{transform:rotate(90deg)}
.wd-page section{display:block}

/* hoofdmenu, taal en optiebalk (opzet van de demo Archiefwaardige opslag) */
.top{align-items:center}
.top>.seg button{padding:6px 12px}
#lang{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.who{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.who b{color:var(--fg);font-weight:500;display:block}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:12px}
.era{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--surface);font-size:12.5px;color:var(--muted)}
.era .eg{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.era .eg>b{color:var(--fg);font-weight:500}
.era .seg{padding:2px}
.era .seg button{padding:3px 10px;font-size:12.5px}
.era .en{flex:1;min-width:240px}

/* waarmerken en workflow */
.tabs button small.cnt.okc{background:var(--green-soft);color:var(--green)}
.wfcard{border:1px solid var(--accent);background:var(--surface);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.wfcard.late{border-color:var(--red)}
.wfcard h4{font-size:14px;font-weight:600}
.wfcard textarea{resize:vertical;min-height:52px}
ol.wf{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ol.wf li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding-bottom:12px;position:relative;font-size:12.5px}
ol.wf li::before{content:"";position:absolute;left:10px;top:22px;bottom:0;width:2px;background:var(--line)}
ol.wf li:last-child::before{display:none}
ol.wf .st{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--surface);border:2px solid var(--line);color:var(--muted)}
ol.wf li.done .st{background:var(--green-soft);border-color:var(--green);color:var(--green)}
ol.wf li.cur .st{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
ol.wf li.cur.late .st{background:var(--red);border-color:var(--red)}
ol.wf li.todo b{color:var(--muted);font-weight:500}
ol.wf b{display:block;font-weight:600;font-size:13px}
ol.wf small{display:block;color:var(--muted);font-size:11.5px}
ol.wf code{font-family:var(--mono);font-size:10.5px;color:var(--muted)}

/* architectuur, techniek, groeipad */
.arch{flex:1;min-height:0;overflow:auto;padding:16px;display:grid;gap:20px;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);align-content:start}
.arch h2,.tech h2{font-size:15px;margin:0 0 4px;font-weight:600}
.arch>div>p,.tech>div>p{margin:0 0 12px;color:var(--muted);max-width:70ch}
.layer{border:1px solid var(--line);border-radius:10px;padding:10px 12px 12px;background:var(--surface2)}
.layer.key{border-color:var(--accent);background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface))}
.layer h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin:0 0 8px}
.layer .hint{margin-top:8px}
.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.bx{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.bx b{display:block;font-weight:600;overflow-wrap:anywhere}
.bx span{font-size:12px;color:var(--muted);display:block;margin-top:2px}
.conn{display:flex;justify-content:center;padding:6px 0;position:relative}
.conn::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--line)}
.conn button{position:relative;background:var(--surface);border:1px solid var(--accent);color:var(--accent);border-radius:99px;padding:3px 12px;font-size:12px;font-weight:500}
.conn button:hover{background:var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:99px;background:var(--surface);font-size:12.5px;font-weight:500;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chips code{font-family:var(--mono);font-size:11px;opacity:.8}
ol.sq{list-style:none;margin:12px 0 8px;padding:0;display:flex;flex-direction:column;gap:8px}
ol.sq li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px}
ol.sq .n{width:22px;height:22px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font-size:11.5px;font-weight:600;color:var(--muted)}
ol.sq p{margin:3px 0 0;font-size:13px;color:var(--fg);max-width:none}
.tech{flex:1;min-height:0;overflow:auto;padding:16px;display:grid;gap:14px;align-content:start;grid-auto-rows:max-content}
.tgrp{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;margin-top:12px}
.tech>.tgrp,.gtwo>.tgrp{margin-top:0}
.tgrp>header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:9px 12px;background:var(--surface2);border-bottom:1px solid var(--line)}
.tgrp>header b{font-weight:600}
.tgrp>header>span:not(.pill){font-size:12px;color:var(--muted);flex:1 1 260px}
.tgrp>div:not(.trow):not(.tw){padding:10px 12px}
.tgrp ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:13px}
.trow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1.2fr);gap:4px 14px;padding:7px 12px;border-bottom:1px solid var(--line);font-size:13px}
.trow:last-child{border-bottom:0}
.trow.hd{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.trow .fn{font-weight:500}
.trow .fn .pill{font-weight:400}
.trow .nt{color:var(--muted)}
.tgrp .tw{max-width:none}
.gband{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;font-size:12px;font-weight:500}
.gband>div{background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:4px 10px;text-align:center}
.gband>.later{background:var(--amber-soft);color:var(--amber)}
.gsteps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.gstep{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.gstep.out{border-style:dashed}
.gstep .gnum{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:600}
.gstep h3{font-size:14px;font-weight:600;margin:0}
.gstep .when{font-size:11.5px;color:var(--muted)}
.gstep dl{margin:0;display:flex;flex-direction:column;gap:6px}
.gstep dt{font-size:11px;color:var(--muted);font-weight:600}
.gstep dd{margin:0}
.gstep .tags{display:flex;flex-wrap:wrap;gap:4px}
.gstep .tags .pill{white-space:normal}
.gfn summary{cursor:pointer;color:var(--accent);font-weight:500}
.gfn ul{margin:6px 0 0;padding-left:16px;display:flex;flex-direction:column;gap:3px}
.gms{margin-top:auto;display:flex;gap:8px;align-items:flex-start;border-top:1px dashed var(--line);padding-top:8px;font-weight:500}
.gms .dia{flex:none;width:9px;height:9px;background:var(--accent);transform:rotate(45deg);margin-top:4px}
.gtwo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.dlg.wide{max-width:760px}
.wirepre{margin:0;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:var(--mono);font-size:11.5px;line-height:1.5;overflow-x:auto;white-space:pre}
@media (max-width:1000px){.arch{grid-template-columns:minmax(0,1fr)}.gsteps,.gband{grid-template-columns:repeat(2,minmax(0,1fr))}.gband>div{grid-column:auto!important}}

.help{flex:1;min-height:0;overflow:auto;padding:16px;display:grid;gap:16px;align-content:start}

.help .lead{margin:0;color:var(--muted);max-width:80ch}
.hsec{display:grid;gap:10px}
.hsec>h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:6px 0 0;font-weight:600}

.hcard{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface);display:grid;gap:6px;align-content:start}
.hcard h4{margin:0;font-size:13.5px;font-weight:600}
.hcard p{margin:0;font-size:12.5px;color:var(--muted)}

.gloss{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:0 18px;margin:0}
.gloss>div{display:grid;grid-template-columns:160px minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}

function policy(c,t,actor){
  if(c.kind==='inc')return{u:'ja',txt:'toegestaan'};
  if(c.kind==='hid')return actor==='team'?{u:'ja',txt:'toegestaan'}:{u:'nee',txt:'geweigerd',grond:actor==='ieder'?PRIV:'Niet nodig voor de taak van de raad'};
  if(c.kind==='att'){
    var kz=D('mail').keuze,k=c.doc==='tekst'?'rv':'rb';
    if((k==='rv'&&kz.rv==='openbaar')||(k==='rb'&&kz.rb==='zonder'))return{u:'ja',txt:'toegestaan · beperkte versie'};
    var cs=D(c.doc).comp,nee=0,vw=0,onb=0;
    for(var n in cs){if(!cs[n].in)continue;var p=policy(cs[n],c.doc,actor);if(p.u==='nee')nee++;if(p.u==='vw')vw++;if(p.u==='onb')onb++}
    if(nee)return{u:'nee',txt:nee+(nee===1?' onderdeel geweigerd':' onderdelen geweigerd'),grond:'Volgt uit de onderdelen van de bijlage'};
    if(vw)return{u:'vw',txt:vw+' onderdeel onder voorwaarde'};
    if(onb)return{u:'onb',txt:onb+' onderdeel niet te beoordelen'};
    return{u:'ja',txt:'toegestaan'};
  }
  if(!known(c,t))return{u:'onb',txt:'niet te beoordelen',grond:'Herkomst is niet vastgelegd'};
  if(SRC[c.src].beperking){
    if(actor==='ieder')return{u:'nee',txt:'geweigerd',grond:SRC[c.src].grond};
    if(actor==='raad')return{u:'vw',txt:'onder voorwaarde',grond:'Ter inzage onder geheimhouding'};
  }
  return{u:'ja',txt:'toegestaan'};
}
function polList(t,actor){var cs=D(t).comp,o=[];for(var k in cs)if(cs[k].in)o.push({k:k,c:cs[k],p:policy(cs[k],t,actor)});return o}
