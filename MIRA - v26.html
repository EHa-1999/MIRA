.tl .t-fn,.tl .t-en,.tl .t-quote,.tl .t-count,.tl .t-hash,.tl .t-pct100,.tl .t-lang,.tl .t-hyph,.tl .t-lnum{font-family:var(--sans);font-weight:500;font-size:11px}

.gal .on{outline:1.5px solid var(--app);outline-offset:-1px}.gal .h1{font-family:var(--sans);font-weight:600;color:var(--app)}.gal .h2{font-family:var(--sans);color:var(--app)}

.rul.h i{left:var(--p);bottom:0;width:1px;height:3px}.rul.h i.mn2{height:5px;bottom:5px;opacity:.4}

.rul.h .mg{top:0;bottom:0}.rul.h .mg.l{left:0}.rul.h .mg.r{right:0}

.rul.v b{left:50%;transform:translate(-50%,-50%) rotate(-90deg)}

.pgwrap{max-width:680px;width:100%;margin-inline:auto;display:grid;grid-template-columns:minmax(0,1fr)}
.pgwrap.hasv{max-width:697px;grid-template-columns:17px minmax(0,1fr)}
.pgwrap>.rul.h{position:sticky;top:-14px;z-index:3;grid-column:-2/-1;grid-row:1}
.pgwrap>.rul.v{grid-column:1;grid-row:2}
.pgwrap>.wd-page{grid-column:-2/-1;grid-row:2}
.slgrid{display:grid;grid-template-columns:17px minmax(0,1fr);grid-template-rows:17px auto}
.slgrid>.corner{background:var(--surface2);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.wd-stat{display:flex;gap:18px;align-items:center;padding:3px 12px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);background:var(--surface2);white-space:nowrap;overflow:hidden;flex:none}

  .rul,.lostrip,.slgrid>.corner,.wd-stat .zm{display:none}

  .rbn,.tbr,.nbr{flex-wrap:wrap}
  .rgs,.tbi{flex:1 1 100%}

  .ch-lo .tbr:nth-child(3){display:none}
  .rgs,.tbi{flex-wrap:wrap}
  .oaw{border-left:0;padding-left:0;margin-left:0;flex-wrap:wrap}
  .rtabs{overflow-x:auto}.rtabs>*{flex:none}
  .rg{flex:0 1 auto;border-right:0}.ri{flex-wrap:wrap}.rgs{gap:4px 0}
  .era.scn .en{flex:1 1 100%}
}

.cells td.err{color:var(--red);font-family:var(--mono);font-size:11.5px}
.cells tbody.rng td{background:color-mix(in srgb,var(--accent-soft) 40%,transparent)}
.cells tbody.rng.lnk td{background:color-mix(in srgb,var(--violet-soft) 45%,transparent)}
.assist .cells tbody.rng{cursor:pointer}
.cells tbody.rng.sel td{background:var(--accent-soft)}
.cells tbody.rng.lnk.sel td{background:var(--violet-soft)}
.cells .rl{margin-left:8px;font-weight:500}
.sheet .foot{padding:6px 10px}
.tabsrow{display:flex;gap:4px;padding:6px 8px;border-top:1px solid var(--line);font-size:12px;flex-wrap:wrap;align-items:center}
.tabsrow span{padding:3px 10px;border:1px solid var(--line);border-radius:0 0 6px 6px;color:var(--muted)}
.tabsrow span.on{background:var(--surface2);color:var(--fg);font-weight:500}
.tabsrow button.hid{padding:3px 10px;border:1px dashed var(--violet);border-radius:0 0 6px 6px;color:var(--violet);font-style:italic;display:inline-flex;gap:5px;align-items:center}
.tabsrow button.hid.sel{background:var(--violet-soft)}
/* presentatie */
.deckwrap{max-width:780px;width:100%;margin-inline:auto;display:flex;gap:10px;transition:opacity .2s}
.rail{display:flex;flex-direction:column;gap:6px;width:96px;flex:none}
.thumb{border:1px solid var(--line);background:var(--paper);border-radius:4px;font-size:10.5px;padding:6px;line-height:1.25;min-height:54px;display:flex;flex-direction:column;gap:2px;color:var(--muted)}
.thumb b{color:var(--fg);font-weight:600}
.thumb[aria-current="true"]{outline:2px solid var(--accent);outline-offset:1px}
.stage{flex:1;min-width:0;display:flex;flex-direction:column;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.slide{background:var(--paper);padding:24px 30px 20px;min-height:330px;display:flex;flex-direction:column;gap:6px;font-family:var(--sans)}
.slide h2{font-size:24px;font-weight:600;line-height:1.2;text-wrap:balance}
.slide .lead{color:var(--muted);font-size:14px}
.slide.title{justify-content:center;border-left:10px solid var(--accent)}
.slide .comp{margin-block:4px}
.notes{background:var(--surface);border-top:1px solid var(--line);padding:10px 16px 12px;font-size:12.5px;font-family:var(--sans)}
.notes h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;margin-bottom:4px}
.notes .comp{margin-block:4px}
/* e-mail */
.mail{background:var(--paper);max-width:680px;width:100%;margin-inline:auto;box-shadow:0 1px 4px rgba(0,0,0,.18);font-family:var(--sans);transition:opacity .2s}
.mhead{display:grid;grid-template-columns:86px minmax(0,1fr);gap:6px 10px;padding:14px 20px;border-bottom:1px solid var(--line);font-size:13px}
.mhead dt{color:var(--muted)} .mhead dd{margin:0;overflow-wrap:anywhere}
.mhead dd.subj{font-weight:600}
.atts{display:flex;flex-wrap:wrap;gap:8px;padding:10px 20px;border-bottom:1px solid var(--line)}
.att{display:flex;gap:8px;align-items:center;border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;min-width:0;max-width:100%}
.att small{display:block;color:var(--muted);font-size:11.5px}
.att .pills{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.assist .att{cursor:pointer}
.assist .att.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.mbody{padding:16px 20px 22px;font-size:14px;line-height:1.6}
.mbody p{margin-bottom:10px;max-width:64ch}
.quote{border-left:3px solid var(--line);padding-left:12px;color:var(--muted);font-size:13px}
.used{display:flex;flex-direction:column;gap:6px}
.used .oitem{margin:0}
.sub2{font-size:12px;color:var(--muted);margin:8px 0 4px;font-weight:600}
.nest{list-style:none;margin:4px 0 0;padding:0 0 0 10px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:4px}
.nest li{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:900px){
  .deckwrap{flex-direction:column}
  .rail{flex-direction:row;width:auto}
  .thumb{flex:1;min-width:0}
  .slide{padding:16px 16px 14px;min-height:0}
  .mhead,.atts,.mbody{padding-inline:14px}
}

/* weergaven */
.views{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--line);flex:1 1 100%;order:2}
.views button{padding:6px 12px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-size:13.5px}
.views button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.views button small{font-weight:400;font-size:10.5px;margin-left:4px}
.ctls{display:flex;flex-wrap:wrap;gap:10px 18px;flex:1 1 100%;order:3}
.ph{flex:1;min-height:0;overflow:auto;padding:22px 24px 30px;display:flex;flex-direction:column;gap:16px}
.ph h2{font-size:19px;font-weight:600;text-wrap:balance;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ph p{max-width:68ch;color:var(--muted)}
.ph h3{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.ph ul,.ph ol{margin:0;padding-left:20px;max-width:72ch;display:flex;flex-direction:column;gap:5px}
.lay{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;max-width:980px}
.lay div{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--surface2)}
.lay b{display:block;font-weight:600;margin-bottom:3px}
.lay span{font-size:12.5px;color:var(--muted)}
.tw{overflow-x:auto;max-width:980px}
.tt{border-collapse:collapse;font-size:13px;width:100%;min-width:560px}
.tt th,.tt td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tt th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
@media (max-width:900px){.ph{overflow:visible;padding:16px}}

/* modules */
.vec{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;display:flex;flex-direction:column;gap:4px}
.vh{display:flex;align-items:baseline;gap:4px 8px;flex-wrap:wrap}
.vh b{font-size:13px;font-weight:600}
.vh span{font-size:11.5px;color:var(--muted)}
.vh .wzd{margin-left:auto}
.vv{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;font-size:13px;font-weight:500}
.vv .pill{flex:none}
.vec .note{margin:2px 0}
.vec .sub2{margin:4px 0 0}
.nest li>span:first-child{min-width:0;flex:1 1 120px}
.gr{display:block;font-size:11px;color:var(--muted);font-weight:400}
.accstate{border-radius:8px;padding:9px 11px;display:flex;flex-direction:column;gap:2px;font-size:12.5px}
.accstate b{font-size:13.5px;font-weight:600}
.accstate.ok{background:var(--green-soft);color:var(--green)}
.accstate.warn{background:var(--amber-soft);color:var(--amber)}
.accstate.off{background:var(--surface2);color:var(--fg);border:1px dashed var(--muted)}
.accstate span{color:var(--fg)}
.finding{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;font-size:12.5px;display:flex;flex-direction:column;gap:5px}
.finding.done{background:transparent}
.finding .fh{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:13px}
.finding .fh b{font-weight:600}
.finding .fh:hover b{text-decoration:underline}
.finding .rowb{margin-top:2px}
.altp{border-left:3px solid var(--accent);padding:4px 9px;background:var(--surface2);border-radius:0 6px 6px 0}
.altp small{display:block;color:var(--muted);font-size:11px}
.fakeh{font-family:var(--sans);font-size:14px;font-weight:600;margin:20px 0 6px}
.hl{background:var(--amber-soft);box-shadow:0 0 0 4px var(--amber-soft);border-radius:2px}
.stage.hl{box-shadow:0 0 0 3px var(--amber)}
.tabs button small.cnt{background:var(--amber-soft);color:var(--amber);border-radius:99px;padding:0 6px;font-weight:600}

/* colofon */
@property --ca{syntax:'<angle>';inherits:false;initial-value:0deg}
.dlg.colo{max-width:640px;padding:0;gap:0;position:relative;overflow:hidden;isolation:isolate;border:1px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,conic-gradient(from var(--ca,0deg),var(--accent),var(--violet),var(--amber),var(--green),var(--accent)) border-box;animation:clBorder 8s linear infinite}
.colo .cfx{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:-1;border-radius:inherit}
.colo .cin{overflow:auto;min-height:0;flex:1}
.colo .aur{position:absolute;inset:-40%;z-index:-1;pointer-events:none;opacity:.32;filter:blur(40px);background:radial-gradient(closest-side at 30% 30%,var(--accent),transparent 70%),radial-gradient(closest-side at 70% 40%,var(--violet),transparent 70%),radial-gradient(closest-side at 50% 75%,var(--amber),transparent 70%);animation:clAur 18s ease-in-out infinite alternate}
.colo .sp{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:0;pointer-events:none;z-index:0;animation:clSp 6s ease-in-out infinite}
.colo .chead{display:flex;gap:16px;align-items:center;padding:18px 18px 4px}
.colo .seal{flex:none;width:96px;height:96px;position:relative}
.colo .seal svg.ring{position:absolute;inset:0;animation:clSpin 28s linear infinite}
.colo .seal text{font:600 8.4px var(--mono,monospace);letter-spacing:.18em;fill:var(--accent)}
.colo .seal svg.core{position:absolute;inset:22px;width:52px;height:52px}
.colo .seal .draw{stroke-dasharray:120;stroke-dashoffset:120;animation:clDraw 1.6s .3s ease-out forwards}
.colo h2.ct{font-size:24px;margin:0;font-weight:700;letter-spacing:-.01em;background:linear-gradient(100deg,var(--fg) 20%,var(--accent) 40%,var(--violet) 50%,var(--fg) 70%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:clShine 6s ease-in-out infinite}
.colo .csub{color:var(--muted);font-size:12.5px;margin-top:2px}
.colo .mb{padding:10px 18px 4px}
.colo dl{display:grid;grid-template-columns:132px minmax(0,1fr);gap:9px 14px;margin:0;font-size:13px}
.colo dt{color:var(--muted)}
.colo dd{margin:0;display:flex;flex-direction:column;gap:1px;overflow-wrap:anywhere}
.colo dd small{color:var(--muted);font-size:12px}
.colo dd ul{list-style:disc;margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.colo dd li{display:list-item;border:0;padding:0}
.colo dd a{color:var(--accent)}
.colo .sel{user-select:all;font-family:var(--mono);font-size:12px}
.colo .cl{opacity:0;transform:translateY(8px);animation:clIn .55s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i)*85ms + 250ms)}
.colo .cnote{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px;color:var(--muted);font-size:12px}
.colo .cfoot{display:flex;justify-content:flex-end;padding:10px 18px 16px}
@media (max-width:560px){.colo .chead{flex-direction:column;align-items:flex-start}.colo dl{grid-template-columns:1fr;gap:2px}.colo dd{margin-bottom:8px}}
@media (prefers-reduced-motion:reduce){.dlg.colo,.colo .aur,.colo .sp,.colo .seal svg.ring,.colo h2.ct{animation:none}.colo .cl{animation:none;opacity:1;transform:none}.colo .seal .draw{animation:none;stroke-dashoffset:0}}
@keyframes clBorder{to{--ca:360deg}}
@keyframes clAur{0%{transform:translate(-6%,-4%) rotate(0deg) scale(1)}100%{transform:translate(6%,5%) rotate(25deg) scale(1.12)}}
@keyframes clSp{0%{opacity:0;transform:translateY(10px) scale(.6)}30%{opacity:.8}100%{opacity:0;transform:translateY(-60px) scale(1.2)}}
@keyframes clSpin{to{transform:rotate(360deg)}}
@keyframes clDraw{to{stroke-dashoffset:0}}
@keyframes clShine{0%{background-position:100% 0}100%{background-position:0 0}}
@keyframes clIn{to{opacity:1;transform:none}}

/* anonimiseren en beoordelen */
.plh{font-family:var(--mono);font-size:.82em;padding:1px 5px;border-radius:4px;cursor:pointer;border:1px solid transparent;white-space:nowrap;font-style:normal;font-weight:500}
.plh.l1{background:var(--green-soft);color:var(--green)}.plh.l2{background:var(--amber-soft);color:var(--amber)}.plh.l3{background:var(--red-soft);color:var(--red)}
.plh.dec{background:transparent;border-color:currentColor;font-family:inherit;font-size:inherit;white-space:normal}
.plh.on,.phn.on{outline:2px solid var(--accent);outline-offset:1px}
.phn{border-bottom:1px dotted var(--muted);cursor:pointer}
.finding .bas{font-size:11.5px;color:var(--muted);margin-left:auto}
.brpick{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.brpick select{flex:1;min-width:140px}
.cells td.dsh{white-space:nowrap}.cells td.dsh .cb{margin-right:5px}
.assist .cells td.dsh.pg{background:var(--amber-soft);cursor:pointer}.assist .cells td.dsh.sel{background:var(--green-soft);cursor:pointer}
.cells td.psd{font-family:var(--mono);font-size:10.5px;color:var(--green);background:color-mix(in srgb,var(--green-soft) 45%,transparent)}
.sheet.ds .cellwrap{max-height:none}
.tabsrow button.tb{padding:3px 10px;border:1px solid var(--line);border-radius:0 0 6px 6px;color:var(--muted)}
.tabsrow button.tb:hover{background:var(--surface2);color:var(--fg)}
.pscols{display:flex;flex-direction:column;gap:1px}
.psc{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:6px;text-align:left;font-size:12.5px;width:100%}
.psc:not(:disabled):hover{background:var(--surface)}.psc:disabled{cursor:default}
.psc>span:nth-child(2){flex:1}.psc .cb{color:var(--muted)}
.psadd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px;color:var(--fg);font-weight:500}
.pschips{display:flex;flex-wrap:wrap;gap:4px;align-items:center}.pschips i{font-style:normal;color:var(--muted)}
.psex{font-family:var(--mono);font-size:11px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px;overflow-wrap:anywhere}.psex i{font-style:normal;color:var(--muted)}
.pii{border-bottom:2px dotted var(--amber);cursor:pointer;border-radius:2px}
.pii.on{background:var(--amber-soft)}
.redact{background:var(--fg);color:var(--bg);font-family:var(--mono);font-size:.78em;padding:1px 6px;border-radius:2px;white-space:nowrap}
mark.rm{background:var(--amber-soft);color:inherit;border-bottom:2px solid var(--amber);cursor:pointer;padding:0 2px;border-radius:2px}
mark.rm.s-lak{background:var(--red-soft);border-color:var(--red);text-decoration:line-through}
mark.rm.s-laat{background:var(--green-soft);border-color:var(--green)}
mark.rm.on{outline:2px solid var(--accent);outline-offset:1px}
mark.rm sup{font-family:var(--sans);font-size:10px;font-weight:600;margin-right:3px;display:inline-block;text-decoration:none}
.num{flex:none;width:20px;height:20px;border-radius:50%;background:var(--amber-soft);color:var(--amber);display:grid;place-items:center;font-size:11px;font-weight:600}
.zk{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.zb{width:44px;height:5px;border-radius:3px;background:var(--line);overflow:hidden;display:block}
.zb i{display:block;height:100%;background:var(--accent)}
.zrow{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.cit{font-family:var(--serif);font-style:italic;color:var(--muted)}
.finding.selc{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.finding .fh{text-align:left}
.comp.rvc{border-color:var(--violet);background:color-mix(in srgb,var(--violet-soft) 40%,transparent)}
#rv-pages .regie{max-width:680px}
#rv-side .p-head{position:sticky;top:0;background:var(--pane);z-index:1}
.sech{display:flex;align-items:center;gap:6px;font:inherit;text-transform:inherit;letter-spacing:inherit;color:inherit;font-weight:600}
.sech svg{transition:transform .12s}
.sech[aria-expanded="true"] svg{transform:rotate(90deg)}
.wd-page section{display:block}

/* hoofdmenu, taal en optiebalk (opzet van de demo Archiefwaardige opslag) */
.top{align-items:center}
.top>.seg button{padding:6px 12px}
#lang{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.who{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.who b{color:var(--fg);font-weight:500;display:block}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:12px}
.era{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--surface);font-size:12.5px;color:var(--muted)}
.era .eg{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.era .eg>b{color:var(--fg);font-weight:500}
.era .seg{padding:2px}
.era .seg button{padding:3px 10px;font-size:12.5px}
.era .en{flex:1;min-width:240px}

/* waarmerken en workflow */
.tabs button small.cnt.okc{background:var(--green-soft);color:var(--green)}
.wfcard{border:1px solid var(--accent);background:var(--surface);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.wfcard.late{border-color:var(--red)}
.wfcard h4{font-size:14px;font-weight:600}
.wfcard textarea{resize:vertical;min-height:52px}
ol.wf{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ol.wf li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding-bottom:12px;position:relative;font-size:12.5px}
ol.wf li::before{content:"";position:absolute;left:10px;top:22px;bottom:0;width:2px;background:var(--line)}
ol.wf li:last-child::before{display:none}
ol.wf .st{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--surface);border:2px solid var(--line);color:var(--muted)}
ol.wf li.done .st{background:var(--green-soft);border-color:var(--green);color:var(--green)}
ol.wf li.cur .st{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
ol.wf li.cur.late .st{background:var(--red);border-color:var(--red)}
ol.wf li.todo b{color:var(--muted);font-weight:500}
ol.wf b{display:block;font-weight:600;font-size:13px}
ol.wf small{display:block;color:var(--muted);font-size:11.5px}
ol.wf code{font-family:var(--mono);font-size:10.5px;color:var(--muted)}

/* architectuur, techniek, groeipad */
.arch{flex:1;min-height:0;overflow:auto;padding:16px;display:grid;gap:20px;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);align-content:start}
.arch h2,.tech h2{font-size:15px;margin:0 0 4px;font-weight:600}
.arch>div>p,.tech>div>p{margin:0 0 12px;color:var(--muted);max-width:70ch}
.layer{border:1px solid var(--line);border-radius:10px;padding:10px 12px 12px;background:var(--surface2)}
.layer.key{border-color:var(--accent);background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface))}
.layer h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin:0 0 8px}
.layer .hint{margin-top:8px}
.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.bx{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.bx b{display:block;font-weight:600;overflow-wrap:anywhere}
.bx span{font-size:12px;color:var(--muted);display:block;margin-top:2px}
.conn{display:flex;justify-content:center;padding:6px 0;position:relative}
.conn::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--line)}
.conn button{position:relative;background:var(--surface);border:1px solid var(--accent);color:var(--accent);border-radius:99px;padding:3px 12px;font-size:12px;font-weight:500}
.conn button:hover{background:var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:99px;background:var(--surface);font-size:12.5px;font-weight:500;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chips code{font-family:var(--mono);font-size:11px;opacity:.8}
ol.sq{list-style:none;margin:12px 0 8px;padding:0;display:flex;flex-direction:column;gap:8px}
ol.sq li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px}

tuk":"Die zusammengesetzte Ansicht des Dokuments","De sprekersnotities staan in het gepubliceerde bestand, met het bedrag dat niet genoemd mocht worden. Kijk bij dia {0}.":"Die Sprechernotizen stehen in der veröffentlichten Datei, mit dem Betrag, der nicht genannt werden durfte. Sehen Sie bei Folie {0} nach.","De sprekersnotities zijn meegepubliceerd":"Die Sprechernotizen wurden mitveröffentlicht","De tabel is gelakt, met de grondslag erbij.":"Die Tabelle ist geschwärzt, mit Angabe der Grundlage.","De titel van het stuk.":"Der Titel des Dokuments.","De titel wordt als laatste voorgelezen, na de grafiek of de kaart.":"Der Titel wird zuletzt vorgelesen, nach dem Diagramm oder der Karte.","De uitkomst per onderdeel in de lijst hierboven.":"Das Ergebnis je Bestandteil in der Liste oben.","De vastgelegde relatie tussen een stuk en een onderdeel: welke bron, welke versie, op welke plek.":"Die erfasste Beziehung zwischen einem Dokument und einem Bestandteil: welche Quelle, welche Version, an welcher Stelle.","De vier omgevingen":"Die vier Umgebungen","De vier omgevingen, het contract ertussen en per handeling de stappen.":"Die vier Umgebungen, der Vertrag dazwischen und je Aktion die Schritte.","De vier stappen":"Die vier Schritte","De vindplaatsen in het stuk en in de onderdelen.":"Die Fundstellen im Dokument und in den Bestandteilen.","De vorige vastgestelde versie is wel gewaarmerkt. Dit concept nog niet.":"Die vorige festgestellte Version ist gesiegelt. Dieser Entwurf noch nicht.","De vragen aan de leveranciers van kantoorpakketten.":"Die Fragen an die Anbieter von Office-Paketen.","De waarde overnemen in het stuk":"Den Wert in das Dokument übernehmen","De waarde staat als kopie in het bestand, maar de assistent kende de herkomst en stelde voor de tabel te lakken. Een medewerker heeft dat bij publicatie bevestigd.":"Der Wert steht als Kopie in der Datei, aber der Assistent kannte die Herkunft und schlug vor, die Tabelle zu schwärzen. Ein Beschäftigter hat das bei der Veröffentlichung bestätigt.","De waarde staat als kopie in het bestand. Bij openbaarmaking stelt de assistent voor dit onderdeel te lakken, op grond van de vastgelegde herkomst.":"Der Wert steht als Kopie in der Datei. Bei der Veröffentlichung schlägt der Assistent vor, diesen Bestandteil zu schwärzen, auf Grundlage der erfassten Herkunft.","De waarden in kolom B hebben geen kop.":"Die Werte in Spalte B haben keine Überschrift.","De waardering volgt uit de classificatie van het stuk, niet uit zijn onderdelen.":"Die Bewertung folgt aus der Klassifikation des Dokuments, nicht aus seinen Bestandteilen.","De weergave wordt bij het opvragen samengesteld. Per onderdeel is getoetst of deze lezer het mag zien. Het vertrouwelijke onderdeel is niet opgehaald.":"Die Ansicht wird beim Abruf zusammengestellt. Je Bestandteil wurde geprüft, ob dieser Leser ihn sehen darf. Der vertrauliche Bestandteil wurde nicht abgerufen.","De weergave wordt per lezer samengesteld; een geweigerd onderdeel wordt een zichtbare leemte.":"Die Ansicht wird je Leser zusammengestellt; ein verweigerter Bestandteil wird zu einer sichtbaren Lücke.","De werkomgeving kan een deel van het document vervangen":"Die Arbeitsumgebung kann einen Teil des Dokuments ersetzen","De werkomgeving laadt het herstelde document opnieuw.":"Die Arbeitsumgebung lädt das korrigierte Dokument neu.","De werkomgeving volstaat; het platform moet er een bewerking bij krijgen.":"Die Arbeitsumgebung genügt; die Plattform braucht eine zusätzliche Operation.","De wettelijke grond waarop een passage niet openbaar wordt. Zij staat zichtbaar bij de passage.":"Der gesetzliche Grund, aus dem eine Passage nicht veröffentlicht wird. Er steht sichtbar bei der Passage.","De zaakverwijzing wordt overgenomen uit het systeem dat de zaak beheert.":"Der Vorgangsverweis wird aus dem System übernommen, das den Vorgang verwaltet.","De zes trappen met wat de medewerker op elke trap merkt, gekoppeld aan de schakelaar Tijdvak.":"Die sechs Stufen mit dem, wa  is buiten de gemeente toegekend, en de assistent verzint geen herkomst.":"Diese Nachricht wurde empfangen, nicht hier erstellt. Die Identität wurde außerhalb der Gemeinde vergeben, und der Assistent erfindet keine Herkunft.","Dit blad is een gegevensset":"Dieses Blatt ist ein Datenbestand","Dit blad is verborgen, maar het zit in het bestand. Het bevat de naam en het telefoonnummer van de grondeigenaar. Wie het bestand krijgt, kan het blad zichtbaar maken.":"Dieses Blatt ist ausgeblendet, aber es steckt in der Datei. Es enthält den Namen und die Telefonnummer des Grundeigentümers. Wer die Datei erhält, kann das Blatt einblenden.","Dit is de enige omgeving die de gemeente niet volledig beheerst. Daarom staan hier geen sleutels, geen tokens en geen gegevens.":"Dies ist die einzige Umgebung, die die Gemeinde nicht vollständig beherrscht. Deshalb liegen hier keine Schlüssel, keine Token und keine Daten.","Dit is een voorstel. Of iets openbaar wordt en op welke grond iets wordt geweigerd, is een besluit van een bevoegde functionaris.":"Dies ist ein Vorschlag. Ob etwas veröffentlicht wird und aus welchem Grund etwas verweigert wird, entscheidet eine befugte Amtsperson.","Dit is het gewone venster van het kantoorpakket; XENA verandert er niets aan. De schijven en letters zijn dezelfde als voorheen. Dossiers verschijnen als mappen met hun nummer, een afgesloten dossier weigert nieuwe stukken, en na het opslaan weet de assistent in welk dossier het stuk staat.":"Dies ist das gewöhnliche Fenster des Office-Pakets; XENA ändert daran nichts. Die Laufwerke und Buchstaben sind dieselben wie zuvor. Akten erscheinen als Ordner mit ihrer Nummer, eine abgeschlossene Akte verweigert neue Dokumente, und nach dem Speichern weiß der Assistent, in welcher Akte das Dokument liegt.","Dit is nog een concept. Voor publicatie hoort hier de vastgestelde versie te staan.":"Dies ist noch ein Entwurf. Für die Veröffentlichung gehört hier die festgestellte Version hin.","Dit is één stuk binnen een dossier.":"Dies ist ein einzelnes Dokument innerhalb einer Akte.","Dit loopt op de achtergrond. Je kunt gewoon doorwerken.":"Das läuft im Hintergrund. Sie können einfach weiterarbeiten.","Dit staat in een verborgen blad. Het paneel kan het niet in beeld brengen zonder het blad zichtbaar te maken.":"Dies steht in einem ausgeblendeten Blatt. Die Seitenleiste kann es nicht anzeigen, ohne das Blatt einzublenden.","Dit stuk":"Dieses Dokument","Dit stuk is in dat dossier aangemaakt.":"Dieses Dokument wurde in dieser Akte angelegt.","Dit stuk is op die datum voor het eerst opgeslagen.":"Dieses Dokument wurde an diesem Datum erstmals gespeichert.","Dit stuk wordt behandeld als één object":"Dieses Dokument wird als ein einziges Objekt behandelt","Dit stuk wordt blijvend bewaard. De bron van dit onderdeel wordt na {0} jaar vernietigd. Wat moet er dan met het onderdeel gebeuren?":"Dieses Dokument wird dauernd aufbewahrt. Die Quelle dieses Bestandteils wird nach {0} Jahren vernichtet. Was soll dann mit dem Bestandteil geschehen?","Domein":"Domäne","Domeinsleutel":"Domänenschlüssel","Doorgeven":"Weiterleiten","Dossier":"Akte","Dossier Zonnepark De Hoge Weide":"Akte Solarpark De Hoge Weide","Draad":"Thread","Drie dia's met sprekersnotities. Het paneel volgt de dia die in beeld is.":"Drei Folien mit Sprechernotizen. Die Seitenleiste folgt der Folie, die gerade sichtbar ist.","Drie momenten: zoals het vandaag gaat, wat vandaag al kan met de assistent, en wat later kan als de kantoorpakketten meebewegen.":"Drei Zeitpunkte: wie es heute läuft, was heute mit dem Assistenten schon geht und was später geht, wenn die Office-Pakete mitziehen.","Drie tabellen op één blad":"Drei Tabellen auf einem Blatt","Duurzaamheid":"Nachhaltigkeit","E-mail":"E-Mail","E-mail (art. {0})":"E-Mail (Art. {0})","E-mail en platte tekst":"E-Mail und reiner Text","E-mailadres":"E-Mail-Adresse","Een aanroep die de integratielaag overslaat, komt niet voor.":"Ein Aufruf, der die Integrationsschicht umgeht, kommt nicht vor.","Een afgeleide van het stuk waarin passages onleesbaar zijn gemaakt. Het origineel blijft ongewijzigd.":"Eine abgeleitete Fassung des Dokuments, in der Passagen unkenntlich gemacht wurden. Das Original bleibt unverändert.","Een bericht is kort; het paneel toont alles.":"Eine Nachricht ist kurz; die Seitenleiste zeigt alles.","Een bericht is kort; het paneel toont alles. Je bekijkt nu een andere stand dan deze werkomgeving levert.":"Eine Nachricht ist kurz; die Seitenleiste zeigt alles. Sie sehen gerade einen anderen Modus, als diese Arbeitsumgebung liefert.","Een bericht met twee bijlagen. Bij het verzenden stelt de assistent één vraag per bijlage.":"Eine Nachricht mit zwei Anhängen. Beim Senden stellt der Assistent eine Frage je Anhang.","Een bericht ontstaat bij het verzenden. Pas dan staat vast wat er is verstuurd.":"Eine Nachricht entsteht beim Senden. Erst dann steht fest, was gesendet wurde.","Een bijlage is een eigen object met een eigen bewaartermijn. Die hoeft niet gelijk te zijn aan die van het bericht.":"Ein Anhang ist ein eigenes Objekt mit eigener Aufbewahrungsfrist. Sie muss nicht der der Nachricht entsprechen.","Een bronvermelding bij wat is ingevoegd, en een melding als de bron daarna wijzigt. De opsteller van een rekenblad ziet wie zijn cijfers gebruikt.":"Eine Quellenangabe zu dem, was eingefügt wurde, und eine Meldung, wenn sich die Quelle danach ändert. Der Verfasser eines Tabellendokuments sieht, wer seine Zahlen verwendet.","Een deel van het document vervangen":"Einen Teil des Dokuments ersetzen","Een demo, geen product. Alle voorbeeldgegevens zijn verzonnen: personen, dossiers en zaaknummers bestaan niet. De demo toont wat de architectuur mogelijk maakt; een deel van de functies is toekomstbeeld.":"Eine Demo, kein Produkt. Alle Beispieldaten sind erfunden: Personen, Akten und Vorgangsnummern existieren nicht. Die Demo zeigt, was die Architektur ermöglicht; ein Teil der Funktionen ist Zukunftsbild.","Een e-mailbericht kan zijn beschrijving niet zelf dragen. De metagegevens staan alleen in het platform.":"Eine E-Mail-Nachricht kann ihre Beschreibung nicht selbst tragen. Die Metadaten stehen nur in der Plattform.","Een eerdere versie is al gewaarmerkt; dat waarmerk blijft gelden voor die versie.":"Eine frühere Version ist bereits gesiegelt; dieses Siegel gilt weiter für jene Version.","Een enkel stuk is een archiefstuk.":"Ein einzelnes Dokument ist ein Schriftstück.","Een gebaar onderscheppen":"Eine Geste abfangen","Een gebonden onderdeel plaatsen":"Einen gebundenen Bestandteil platzieren","Een gedocumenteerde leemte aanvaarden":"Eine dokumentierte Lücke akzeptieren","Een gegeven over iemands gezondheid. In de gepubliceerde versie staat alleen “persoonsgegeven”, omdat de soort zelf al iets over de persoon zegt.":"Eine Angabe zur Gesundheit einer Person. In der veröffentlichten Version steht nur „personenbezogenes Datum“, weil schon die Art etwas über die Person aussagt.","Een gemaskeerde passage en de beschrijving van het stuk bestaan één keer, in het platform. Elk formaat draagt daarvan een afdruk.":"Eine maskierte Passage und die Beschreibung des Dokuments gibt es genau einmal, in der Plattform. Jedes Format trägt davon einen Abdruck.","Een ingesloten onderdeel is een kopie in het stuk. Een gekoppeld onderdeel is een eigen object waarnaar het stuk verwijst. Met de assistent krijgt ook een kopie een vastgelegde herkomst: bron, versie en moment.":"Ein eingebetteter Bestandteil ist eine Kopie im Dokument. Ein verknüpfter Bestandteil ist ein eigenes Objekt, auf das das Dokument verweist. Mit dem Assistenten erhält auch eine Kopie eine erfasste Herkunft: Quelle, Version und Zeitpunkt.","Een keuze bij invoegen:":"Eine Auswahl beim Einfügen:","Een lezer heeft geen paneel. Bronvermeldingen, leemtes en verouderingssignalen staan in het stuk zelf, zodat iedereen ze ziet.":"Ein Leser hat keine Seitenleiste. Quellenangaben, Lücken und Veraltungshinweise stehen im Dokument selbst, damit alle sie sehen.","Een matrix van documenttype en werkomgeving, met per module het minimale vermogen.":"Eine Matrix aus Dokumenttyp und Arbeitsumgebung, mit der Mindestfähigkeit je Modul.","Een momentopname, deels aanname. Juist hier breiden leveranciers hun koppelvlakken geregeld uit.":"Eine Momentaufnahme, teils Annahme. Gerade hier erweitern Anbieter ihre Schnittstellen regelmäßig.","Een niveau op de ladder van wat een onderdeel kan, van losse kopie tot samengestelde weergave.":"Eine Stufe auf der Leiter dessen, was ein Bestandteil kann, von der losen Kopie bis zur zusammengesetzten Ansicht.","Een of meer onderdelen tonen niet de laatste versie van de bron. Je kunt toch vaststellen; het verschil blijft zichtbaar.":"Ein oder mehrere Bestandteile zeigen nicht die neueste Version der Quelle. Sie können trotzdem feststellen; der Unterschied bleibt sichtbar.","Een onderdeel dat met één klik ververst, en uiteindelijk een weergave die per lezer wordt samengesteld.":"Ein Bestandteil, der sich mit einem Klick aktualisiert, und schließlich eine Ansicht, die je Leser zusammengestellt wird.","Een onderdeel uit een vertrouwelijke bron blijft vertrouwelijk, ook in een openbaar stuk. De lezer ziet een leemte met de grondslag erbij.":"Ein Bestandteil aus einer vertraulichen Quelle bleibt vertraulich, auch in einem öffentlichen Dokument. Der Leser sieht eine Lücke mit der Grundlage dazu.","Een openbare, uitvoerbare toets.":"Ein öffentlicher, ausführbarer Test.","Een plaatsaanduiding die een externe identificatie draagt":"Ein Platzhalter, der eine externe Kennung trägt","Een plaatsaanduiding die een identificatie draagt, een keuze bij invoegen en een weergave van herkomst.":"Ein Platzhalter, der eine Kennung trägt, eine Auswahl beim Einfügen und eine Anzeige der Herkunft.","Een plaatsaanduiding die een identificatie kan dragen":"Ein Platzhalter, der eine Kennung tragen kann","Een raadsvoorstel in de tekstverwerker, met het paneel van de assistent ernaast. Dit is het meest uitgewerkte stuk; begin hier.":"Eine Ratsvorlage in der Textverarbeitung, mit der Seitenleiste des Assistenten daneben. Dies ist das am weitesten ausgearbeitete Dokument; beginnen Sie hier.","Een raadsvoorstel lijkt één document. In werkelijkheid zit het vol met dingen die ergens anders vandaan komen: een tabel uit een rekenblad, een grafiek, een kaart.":"Eine Ratsvorlage wirkt wie ein einziges Dokument. In Wirklichkeit steckt sie voller Dinge, die von anderswo stammen: eine Tabelle aus einem Tabellendokument, ein Diagramm, eine Karte.","Een route om te proberen":"Ein Weg zum Ausprobieren","Een stuk erft de strengste beperking van zijn onderdelen.":"Ein Dokument erbt die strengste Beschränkung seiner Bestandteile.","Een stuk is minstens zo vertrouwelijk als zijn strengste onderdeel. Verhogen mag afgeleid gebeuren.":"Ein Dokument ist mindestens so vertraulich wie sein strengster Bestandteil. Hochstufen darf abgeleitet erfolgen.","Een stuk met een eigen identificatie in het platform, los van de plek waar het bestand staat.":"Ein Dokument mit eigener Kennung in der Plattform, unabhängig davon, wo die Datei liegt.","Een stuk neemt de archiefvormer van zijn dossier over.":"Ein Dokument übernimmt den Registraturbildner seiner Akte.","Een vastgesteld stuk staat stil. Het blijft versie {0} tonen, en het verschil met versie {1} is voor elke lezer zichtbaar.":"Ein festgestelltes Dokument steht still. Es zeigt weiterhin Version {0}, und der Unterschied zu Version {1} ist für jeden Leser sichtbar.","Een voorbeeld om het idee te tonen, geen specificatie.":"Ein Beispiel, um die Idee zu zeigen, keine Spezifikation.","Een voorstel, nooit een vaststelling.":"Ein Vorschlag, nie eine Feststellung.","Een waarde met erbij wie haar heeft bepaald, wanneer, waarom en waarop.":"Ein Wert mit der Angabe, wer ihn bestimmt hat, wann, warum und worauf gestützt.","Een waarmerk namens de afdeling is het zegel van de organisatie, met de afdeling erbij vastgelegd.":"Ein Siegel im Namen der Abteilung ist das Siegel der Organisation, bei dem die Abteilung mit festgehalten wird.","Een waarmerk namens de auteur is een elektronische handtekening van een persoon: zij staat in voor haar eigen versie.":"Ein Siegel im Namen des Autors ist eine elektronische Signatur einer Person: Sie steht für ihre eigene Version ein.","Een waarmerk namens de organisatie is een elektronisch zegel. De assistent legt vast wie het heeft aangevraagd.":"Ein Siegel im Namen der Organisation ist ein elektronisches Siegel. Der Assistent hält fest, wer es beantragt hat.","Een weergave per lezer":"Eine Ansicht je Leser","Een weergave van herkomst:":"Eine Anzeige der Herkunft:","Een weergavemodus voor gebonden onderdelen":"Ein Anzeigemodus für gebundene Bestandteile","Eerdere waarmerken":"Frühere Siegel","Eerste jaar lager door gefaseerde oplevering.":"Erstes Jahr niedriger wegen gestaffelter Inbetriebnahme.","Eerste keer opslaan":"Erstes Speichern","Eigenschappen in het bestand schrijven":"Eigenschaften in die Datei schreiben","Eindemarkeringen":"Umbrüche","Eindnoot invoegen":"Endnote einfügen","Elders in de organisatie":"An anderer Stelle in der Organisation","Elk object krijgt bij het eerste opslaan een identificatie.":"Jedes Objekt erhält beim ersten Speichern eine Kennung.","Elk persoonsgegeven is vervangen door een plaatshouder. De waarde zelf is versleuteld bewaard; wie het niveau heeft, ziet het origineel.":"Jedes personenbezogene Datum ist durch einen Platzhalter ersetzt. Der Wert selbst ist verschlüsselt aufbewahrt; wer die Stufe hat, sieht das Original.","Elk veld krijgt een eigen pseudoniem per soort. De kolommen zijn onderling niet direct te koppelen.":"Jedes Feld erhält ein eigenes Pseudonym je Art. Die Spalten lassen sich untereinander nicht direkt verknüpfen.","Elke stap is een taak met een eigen identificatie in het register. Je ziet hier alleen de stappen van dit stuk, niet je hele takenlijst.":"Jeder Schritt ist eine Aufgabe mit eigener Kennung im Register. Sie sehen hier nur die Schritte dieses Dokuments, nicht Ihre gesamte Aufgabenliste.","Elke vastlegging is een gebeurtenis. Een module heeft geen eigen opslag en geen eigen logboek.":"Jede Erfassung ist ein Ereignis. Ein Modul hat keinen eigenen Speicher und kein eigenes Protokoll.","Enkelvoudig":"Einfach","Enkelvoudige en samengestelde objecten":"Einfache und zusammengesetzte Objekte","Er is geen bewering. Dat is iets anders dan een standaardwaarde.":"Es gibt keine Aussage. Das ist etwas anderes als ein Standardwert.","Er is nog geen bewering met genoeg gezag. De classificatie is een voorstel van een programma, en daaruit mag geen bewaartermijn volgen.":"Es gibt noch keine Aussage mit ausreichender Autorität. Die Klassifikation ist der Vorschlag eines Programms, und daraus darf keine Aufbewahrungsfrist folgen.","Er moet een moment zijn waarop vaststaat dat dit de versie is waarover is besloten. Stel het stuk eerst vast.":"Es muss einen Zeitpunkt geben, zu dem feststeht, dass dies die Version ist, über die entschieden wurde. Stellen Sie das Dokument zuerst fest.","Er wordt niets meer van je verwacht.":"Von Ihnen wird nichts mehr erwartet.","Etniciteit (art. {0})":"Ethnische Herkunft (Art. {0})","Excel meldt alleen op navraag wat in beeld is. Het paneel loopt daardoor een fractie achter.":"Excel meldet nur auf Anfrage, was sichtbar ist. Die Seitenleiste hinkt dadurch einen Moment hinterher.","Excel meldt alleen op navraag wat in beeld is. Het paneel loopt daardoor een fractie achter. Je bekijkt nu een andere stand dan deze werkomgeving levert.":"Excel meldet nur auf Anfrage, was sichtbar ist. Die Seitenleiste hinkt dadurch einen Moment hinterher. Sie sehen gerade einen anderen Modus, als diese Arbeitsumgebung liefert.","Excel-werkmap (*.xlsx)":"Excel-Arbeitsmappe (*.xlsx)","Exploitatie over {0} jaar":"Betriebsrechnung über {0} Jahre","Exploitatieberekening initiatiefnemer":"Betriebsrechnung des Vorhabenträgers","Extra":"Extras","Eén adapter, de basisvermogens en twee modules: metadateren en toegankelijkheid.":"Ein Ad engesteld; een geweigerd onderdeel wordt een zichtbare leemte.":"La vue est composée pour chaque lecteur ; un composant refusé devient une lacune visible.","De werkomgeving kan een deel van het document vervangen":"L'environnement de travail peut remplacer une partie du document","De werkomgeving laadt het herstelde document opnieuw.":"L'environnement de travail recharge le document corrigé.","De werkomgeving volstaat; het platform moet er een bewerking bij krijgen.":"L'environnement de travail suffit ; la plateforme doit recevoir une opération supplémentaire.","De wettelijke grond waarop een passage niet openbaar wordt. Zij staat zichtbaar bij de passage.":"Le motif légal pour lequel un passage n'est pas rendu public. Il figure de façon visible à côté du passage.","De zaakverwijzing wordt overgenomen uit het systeem dat de zaak beheert.":"La référence de l'affaire est reprise du système qui gère l'affaire.","De zes trappen met wat de medewerker op elke trap merkt, gekoppeld aan de schakelaar Tijdvak.":"Les six paliers et ce que l'agent remarque à chacun d'eux, reliés au sélecteur Période.","De-anonimiseer (PPL {0}+)":"Désanonymiser (PPL {0}+)","Deel van het document vervangen":"Remplacer une partie du document","Deelnemers":"Participants","Demo":"Démo","Detectie":"Détection","Deze bewerking raakt het hele document en kan daarom nooit op een deel worden uitgevoerd.":"Cette opération touche l'ensemble du document et ne peut donc jamais être exécutée sur une partie.","Deze dia":"Cette diapositive","Deze laag doet niets wat het platform niet kan. Zij doet wat de werkplek niet mag.":"Cette couche ne fait rien que la plateforme ne sache faire. Elle fait ce que le poste de travail n'a pas le droit de faire.","Deze mailomgeving laat geen controle vooraf toe. Beide bijlagen zijn volledig verstuurd; de assistent heeft dat na verzending vastgelegd en gesignaleerd.":"Cette messagerie ne permet pas de vérification préalable. Les deux pièces jointes ont été envoyées intégralement ; l'assistant l'a consigné et signalé après l'envoi.","Deze map is leeg.":"Ce dossier est vide.","Deze pc":"Ce PC","Deze procedure is voltooid":"Cette procédure est terminée","Deze stap volgt het bericht: hij is afgerond zodra je het verzendt.":"Cette étape suit le message : elle est terminée dès que vous l'envoyez.","Deze stap volgt het stuk: hij is afgerond zodra de vastgestelde versie is gewaarmerkt.":"Cette étape suit le document : elle est terminée dès que la version arrêtée est scellée.","Deze stap volgt het stuk: hij is afgerond zodra je de presentatie vaststelt.":"Cette étape suit le document : elle est terminée dès que vous arrêtez la présentation.","Deze stap volgt het stuk: hij is afgerond zodra je het raadsvoorstel vaststelt.":"Cette étape suit le document : elle est terminée dès que vous arrêtez la proposition au conseil.","Deze versie is niet gewaarmerkt":"Cette version n’est pas scellée","Deze weergave beheert de assistent zelf. Daardoor bestaat hier wel een pagina, en beweegt de lijst in elke werkomgeving op dezelfde manier mee.":"L'assistant gère lui-même cette vue. C'est pourquoi la notion de page existe ici, et la liste suit de la même manière dans chaque environnement de travail.","Deze werkomgeving haalt trap {0} nog niet; de assistent valt terug op trap {1}.":"Cet environnement de travail n'atteint pas encore le palier {0} ; l'assistant se replie sur le palier {1}.","Deze werkomgeving kan geen deel van het document vervangen. Het document is opnieuw geladen.":"Cet environnement de travail ne peut pas remplacer une partie du document. Le document a été rechargé.","Deze werkomgeving meldt niet wat in beeld is. Daarom staat hier de hele lijst, en springen kan alleen per pagina.":"Cet environnement de travail n'indique pas ce qui est à l'écran. C'est pourquoi la liste complète s'affiche ici, et la navigation ne se fait que page par page.","Deze werkomgeving meldt niet wat in beeld is. Daarom staat hier de hele lijst, en springen kan alleen per pagina. Je bekijkt nu een andere stand dan deze werkomgeving levert.":"Cet environnement de travail n'indique pas ce qui est à l'écran. C'est pourquoi la liste complète s'affiche ici, et la navigation ne se fait que page par page. Vous consultez actuellement un autre mode que celui fourni par cet environnement de travail.","Dezelfde assistent in tekst, rekenblad, presentatie en e-mail, plus architectuur, techniek en groeipad.":"Le même assistant pour le texte, le classeur, la présentation et l'e-mail, avec en plus l'architecture, la technique et la trajectoire.","Dezelfde persoon krijgt hetzelfde pseudoniem in alle kolommen.":"La même personne reçoit le même pseudonyme dans toutes les colonnes.","Dezelfde waarde met dezelfde sleutel geeft hetzelfde pseudoniem.":"La même valeur avec la même clé donne le même pseudonyme.","Dia":"Diapo","Dia {0}":"Diapositive {0}","Dia {0} van {1}":"Diapositive {0} sur {1}","Dia {0}: Presentatie: Noor Bakker, beleidsmedewerker":"Diapositive {0} : Présentation : Noor Bakker, chargée de mission","Dia's":"Diapositives","Dia's opstellen":"Préparer les diapositives","Diavoorstelling":"Diaporama","Dit bericht is ontvangen, niet hier gemaakt. De identiteit is buiten de gemeente toegekend, en de assistent verzint geen herkomst.":"Ce message a été reçu, il n'a pas été créé ici. Son identité a été attribuée hors de la commune, et l'assistant n'invente pas de provenance.","Dit blad is een gegevensset":"Cette feuille est un jeu de données","Dit blad is verborgen, maar het zit in het bestand. Het bevat de naam en het telefoonnummer van de grondeigenaar. Wie het bestand krijgt, kan het blad zichtbaar maken.":"Cette feuille est masquée, mais elle se trouve dans le fichier. Elle contient le nom et le numéro de téléphone du propriétaire du terrain. Quiconque reçoit le fichier peut afficher la feuille.","Dit is de enige omgeving die de gemeente niet volledig beheerst. Daarom staan hier geen sleutels, geen tokens en geen gegevens.":"C'est le seul environnement que la commune ne maîtrise pas entièrement. C'est pourquoi il n'y a ici ni clés, ni jetons, ni données.","Dit is een voorstel. Of iets openbaar wordt en op welke grond iets wordt geweigerd, is een besluit van een bevoegde functionaris.":"Ceci est une proposition. Décider si un élément est divulgué et pour quel motif il est refusé relève d'un fonctionnaire habilité.","Dit is het gewone venster van het kantoorpakket; XENA verandert er niets aan. De schijven en letters zijn dezelfde als voorheen. Dossiers verschijnen als mappen met hun nummer, een afgesloten dossier weigert nieuwe stukken, en na het opslaan weet de assistent in welk dossier het stuk staat.":"C’est la fenêtre ordinaire de la suite bureautique ; XENA n’y change rien. Les lecteurs et leurs lettres sont les mêmes qu’avant. Les dossiers apparaissent comme des répertoires portant leur numéro, un dossier clôturé refuse les nouveaux documents, et après l’enregistrement l’assistant sait dans quel dossier se trouve le document.","Dit is nog een concept. Voor publicatie hoort hier de vastgestelde versie te staan.":"Il s'agit encore d'un projet. Pour la publication, c'est la version arrêtée qui doit figurer ici.","Dit is één stuk binnen een dossier.":"Il s'agit d'un seul document au sein d'un dossier.","Dit loopt op de achtergrond. Je kunt gewoon doorwerken.":"Cela se déroule en arrière-plan. Vous pouvez continuer à travailler.","Dit staat in een verborgen blad. Het paneel kan het niet in beeld brengen zonder het blad zichtbaar te maken.":"Cet élément se trouve dans une feuille masquée. Le volet ne peut pas l'afficher sans rendre la feuille visible.","Dit stuk":"Ce document","Dit stuk is in dat dossier aangemaakt.":"Ce document a été créé dans ce dossier.","Dit stuk is op die datum voor het eerst opgeslagen.":"Ce document a été enregistré pour la première fois à cette date.","Dit stuk wordt behandeld als één object":"Ce document est traité comme un seul objet","Dit stuk wordt blijvend bewaard. De bron van dit n et le moment sont consignés.","Het paneel beweegt mee met het stuk, voor zover de adapter meldt wat in beeld is.":"Le volet suit le document, dans la mesure où l'adaptateur signale ce qui est à l'écran.","Het paneel en de modules. Gelijk in elke werkomgeving.":"Le volet et les modules. Identiques dans chaque environnement de travail.","Het paneel en het stuk zelf tonen dat het onderdeel een oudere versie laat zien.":"Le volet et le document lui-même montrent que le composant affiche une version antérieure.","Het paneel hoort bij het stuk dat open staat. Bovenaan staat de status van het stuk, daaronder wat aandacht vraagt. Rechts kies je een module; de knoppen in de balk van het kantoorpakket doen hetzelfde.":"Le volet accompagne le document ouvert. En haut figure le statut du document, en dessous ce qui demande votre attention. À droite, vous choisissez un module ; les boutons de la barre de la suite bureautique font la même chose.","Het paneel hoort bij het stuk dat open staat. Overzicht toont de status van het stuk en wat aandacht vraagt. Rechts kies je een module; de knoppen in de balk van het kantoorpakket doen hetzelfde.":"Le volet accompagne le document ouvert. La vue d’ensemble montre le statut du document et ce qui demande votre attention. À droite, vous choisissez un module ; les boutons de la barre de la suite bureautique font la même chose.","Het paneel stelt één vraag: de waarde overnemen of een leemte aanvaarden.":"Le volet pose une seule question : reprendre la valeur ou accepter une lacune.","Het paneel toont":"Le volet affiche","Het park levert vanaf {0} de volle opbrengst.":"Le parc atteint sa pleine production à partir de {0}.","Het perceel ligt tussen de provinciale weg en de Weidevaart.":"La parcelle se situe entre la route provinciale et la Weidevaart.","Het platform is leidend; het bestand draagt een afdruk.":"La plateforme fait foi ; le fichier en porte une trace.","Het platform schrijft het bestand als nieuwe versie; de werkomgeving laadt h ersion {0}. Le document lui-même signale où il affiche une version antérieure.","Het rekenblad staat nu op versie {0}. Kijk in het paneel wat dat voor de bijlagen betekent.":"Le classeur est maintenant à la version {0}. Voyez dans le volet ce que cela signifie pour les pièces jointes.","Het rekenblad staat nu op versie {0}. Zonder assistent verandert hier niets en krijgt niemand een melding.":"Le classeur est maintenant à la version {0}. Sans l’assistant, rien ne change ici et personne n’est averti.","Het soort stuk bepaalt een eerste voorstel.":"Le type de document détermine une première proposition.","Het stuk en de samenstelling zijn ongewijzigd sinds het waarmerk.":"Le document et sa composition sont inchangés depuis le scellement.","Het stuk is een samenstelling. Elk onderdeel houdt een vastgelegde relatie met zijn bron: welke bron, welke versie, op welke plek.":"Le document est une composition. Chaque composant conserve une relation consignée avec sa source : quelle source, quelle version, à quel endroit.","Het stuk is vanuit het dossier geopend.":"Le document a été ouvert depuis le dossier.","Het stuk is vastgesteld. Maak een nieuwe conceptversie om iets in te voegen.":"Le document est arrêté. Créez une nouvelle version de projet pour y insérer un élément.","Het stuk is één bestand. Wat erin is geplakt, is een kopie zonder geheugen: niemand weet uit welke bron of welke versie zij komt.":"Le document est un seul fichier. Ce qui y a été collé est une copie sans mémoire : personne ne sait de quelle source ni de quelle version elle provient.","Het stuk wordt vastgesteld zoals het er nu staat. Niemand vraagt waar de cijfers vandaan komen of hoe lang ze bewaard mogen worden.":"Le document est arrêté tel qu'il se présente. Personne ne demande d'où viennent les chiffres ni combien de temps ils peuvent être conservés.","Het stuk zelf":"Le document lui-même","Het stuk zoals het is vastgelegd":"Le document tel qu'il est consigné","Het uitvoeringspad per werkomgeving: te  travail","Werkt overal, maar prettiger waar de werkomgeving meer prijsgeeft. Ontbreekt het vermogen, dan valt de functie zichtbaar terug.":"Fonctionne partout, mais plus agréablement là où l'environnement de travail en révèle davantage. Si la capacité manque, la fonction se replie de façon visible.","Wethouder, genoemd in functie. Namen van bestuurders blijven doorgaans staan.":"Échevin, cité ès qualités. Les noms des élus de l'exécutif sont généralement conservés.","Wie":"Qui","Wie alleen het stuk waarmerkt, kan niet aantonen waaruit het is opgebouwd. Daarom horen de bindingen erbij, vastgezet op hun versie.":"Sceller le seul document ne permet pas de démontrer de quoi il est composé. C'est pourquoi les liaisons en font partie, figées sur leur version.","Wie de medewerker is, regelt de laag erachter.":"Qui est l'agent : la couche située derrière s'en charge.","Wie geen toegang heeft tot de bron, ziet op deze plek een zichtbare leemte met de grondslag.":"Quiconque n'a pas accès à la source voit à cet endroit une lacune visible, avec son fondement.","Wie zegt dat?":"Qui le dit ?","Wijzigingen":"Modifications","Wijzigingen bijhouden":"Suivi des modifications","Wijzigt de bron, dan meldt het onderdeel dat het een oudere versie toont. Vandaag merkt niemand dat.":"Si la source change, le composant signale qu’il affiche une version antérieure. Aujourd’hui, personne ne le remarque.","Wijzigt een collega het rekenblad, dan verandert hier niets en krijgt niemand een melding. Probeer het met de knop boven het document.":"Si un collègue modifie le classeur, rien ne change ici et personne n'est averti. Essayez avec le bouton au-dessus du document.","Woo artikel {0} lid {1} d":"Woo article {0} paragraphe {1} point d","Woo artikel {0} lid {1} e":"Woo article {0} paragraphe {1} point e","Woo artikel {0} lid {1} onder c (bedrijfs- en fabricagegegevens)":"Woo article {0} paragraphe {1} point c (données commerciales et industrielles)","Woo artikel {0} lid {1} onder e (persoonlijke l
